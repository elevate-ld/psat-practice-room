{id:"me11",s:"m",d:"Advanced Math",k:"Quadratics",mod:"E",q:`What are the solutions to <i>x</i><sup>2</sup> = 49?`,c:["7 only","−7 and 7","−49 and 49","24.5 only"],a:1,x:`Both 7<sup>2</sup> and (−7)<sup>2</sup> equal 49. Don't forget the negative solution.`},
{id:"me12",s:"m",d:"Advanced Math",k:"Equivalent expressions",mod:"E",q:`Which expression is equivalent to (2<i>x</i>)(3<i>x</i>)?`,c:["5<i>x</i>","6<i>x</i>","5<i>x</i><sup>2</sup>","6<i>x</i><sup>2</sup>"],a:3,x:`Multiply coefficients (2 × 3 = 6) and variables (<i>x</i> · <i>x</i> = <i>x</i><sup>2</sup>).`},
{id:"me13",s:"m",d:"Advanced Math",k:"Factoring",mod:"E",q:`Which expression is equivalent to <i>x</i><sup>2</sup> − 9?`,c:["(<i>x</i> − 3)<sup>2</sup>","(<i>x</i> − 3)(<i>x</i> + 3)","(<i>x</i> − 9)(<i>x</i> + 1)","(<i>x</i> + 3)<sup>2</sup>"],a:1,x:`Difference of squares: <i>a</i><sup>2</sup> − <i>b</i><sup>2</sup> = (<i>a</i> − <i>b</i>)(<i>a</i> + <i>b</i>).`},
{id:"me14",s:"m",d:"Advanced Math",k:"Exponents",mod:"E",t:"gi",ans:[5],q:`If 2<sup><i>x</i></sup> = 32, what is the value of <i>x</i>?`,x:`2 × 2 × 2 × 2 × 2 = 32, so <i>x</i> = <b>5</b>.`},
{id:"me15",s:"m",d:"Advanced Math",k:"Exponential functions",mod:"E",q:`An account holds $100 and grows by 10% each year. How much will it hold after 1 year?`,c:["$101","$110","$120","$200"],a:1,x:`10% of $100 is $10, so $100 + $10 = $110.`},
{id:"me16",s:"m",d:"Problem-Solving & Data Analysis",k:"Mean and median",mod:"E",t:"gi",ans:[9],q:`What is the mean of 6, 8, 10, and 12?`,x:`(6 + 8 + 10 + 12) ÷ 4 = 36 ÷ 4 = <b>9</b>.`},
{id:"me17",s:"m",d:"Problem-Solving & Data Analysis",k:"Percentages",mod:"E",q:`What is 30% of 80?`,c:["18","24","26","50"],a:1,x:`0.30 × 80 = 24.`},
{id:"me18",s:"m",d:"Problem-Solving & Data Analysis",k:"Ratios and proportions",mod:"E",q:`A recipe uses 3 cups of flour to make 12 cookies. How many cups of flour are needed to make 36 cookies?`,c:["6","9","12","15"],a:1,x:`36 is 3 times 12, so use 3 × 3 = 9 cups.`},
{id:"me19",s:"m",d:"Problem-Solving & Data Analysis",k:"Probability",mod:"E",q:`A bag contains 4 red marbles and 6 blue marbles. If one marble is chosen at random, what is the probability that it is red?`,c:["1/4","2/5","3/5","2/3"],a:1,x:`4 red out of 10 total = 4/10 = 2/5. The 2/3 trap divides red by blue instead of by the total.`},
{id:"me20",s:"m",d:"Geometry & Trigonometry",k:"Area and perimeter",mod:"E",q:`A rectangle has a length of 7 and a width of 5. What is its area?`,c:["12","24","35","70"],a:2,x:`Area = 7 × 5 = 35. (24 is the perimeter.)`},
{id:"me21",s:"m",d:"Geometry & Trigonometry",k:"Angles",mod:"E",q:`Two angles of a triangle measure 50° and 60°. What is the measure of the third angle?`,c:["60°","70°","80°","90°"],a:1,x:`Triangle angles sum to 180°: 180 − 50 − 60 = 70.`},
{id:"me22",s:"m",d:"Geometry & Trigonometry",k:"Circles",mod:"E",q:`What is the circumference of a circle with radius 5?`,c:["5π","10π","25π","100π"],a:1,x:`<i>C</i> = 2π<i>r</i> = 10π. (25π is the area.)`},

/* ===== Math Module 2: harder ===== */
{id:"mh1",s:"m",d:"Algebra",k:"Systems of equations",mod:"H",t:"gi",ans:[-4],q:`3<i>x</i> − 2<i>y</i> = 7<br>6<i>x</i> + <i>ky</i> = 10<br>In the system above, <i>k</i> is a constant. For what value of <i>k</i> does the system have no solution?`,x:`No solution means parallel lines: same slope, different intercepts. Doubling the first equation gives 6<i>x</i> − 4<i>y</i> = 14. For the second to be parallel, <i>k</i> = <b>−4</b> (and 10 ≠ 14, so the lines don't overlap).`},
{id:"mh2",s:"m",d:"Algebra",k:"Slope",mod:"H",q:`Line ℓ passes through the point (0, 4) and is perpendicular to the line <i>y</i> = −(2/3)<i>x</i> + 1. Which equation defines line ℓ?`,c:["<i>y</i> = −(2/3)<i>x</i> + 4","<i>y</i> = (2/3)<i>x</i> + 4","<i>y</i> = (3/2)<i>x</i> + 4","<i>y</i> = −(3/2)<i>x</i> + 4"],a:2,x:`Perpendicular slopes are negative reciprocals: −2/3 → 3/2. The point (0, 4) is the <i>y</i>-intercept.`},
{id:"mh3",s:"m",d:"Algebra",k:"Linear equations",mod:"H",q:`If <i>x</i>/3 + <i>x</i>/6 = 5, what is the value of <i>x</i>?`,c:["5","10","15","30"],a:1,x:`Multiply everything by 6: 2<i>x</i> + <i>x</i> = 30, so 3<i>x</i> = 30 and <i>x</i> = 10.`},
{id:"mh4",s:"m",d:"Algebra",k:"Linear models",mod:"H",q:`The equation <i>F</i> = 1.8<i>C</i> + 32 converts a temperature <i>C</i> in degrees Celsius to <i>F</i> in degrees Fahrenheit. Which statement must be true?`,c:["An increase of 1 degree Celsius corresponds to an increase of 32 degrees Fahrenheit.","An increase of 1 degree Celsius corresponds to an increase of 1.8 degrees Fahrenheit.","An increase of 1 degree Fahrenheit corresponds to an increase of 1.8 degrees Celsius.","When <i>C</i> = 0, <i>F</i> = 1.8."],a:1,x:`The slope (1.8) is the change in <i>F</i> per 1-unit change in <i>C</i>. The 32 is the starting value when <i>C</i> = 0.`},
{id:"mh5",s:"m",d:"Algebra",k:"Linear equations",mod:"H",t:"gi",ans:[12],q:`A store sells notebooks for $3.00 each and pens for $1.50 each. Mia spent exactly $30.00 and bought 3 times as many pens as notebooks. How many pens did she buy?`,x:`Let <i>n</i> = notebooks, so pens = 3<i>n</i>. 3<i>n</i> + 1.5(3<i>n</i>) = 30 → 7.5<i>n</i> = 30 → <i>n</i> = 4. Pens = 3 × 4 = <b>12</b>. Answer the question asked (pens, not notebooks).`},
{id:"mh6",s:"m",d:"Algebra",k:"Linear equations",mod:"H",q:`In the equation <i>a</i>(<i>x</i> + 2) = 3<i>x</i> + 6, <i>a</i> is a constant. For what value of <i>a</i> does the equation have infinitely many solutions?`,c:["2","3","6","9"],a:1,x:`Infinitely many solutions means both sides are identical. 3<i>x</i> + 6 = 3(<i>x</i> + 2), so <i>a</i> = 3.`},
{id:"mh7",s:"m",d:"Algebra",k:"Linear functions",mod:"H",q:`The line <i>y</i> = <i>kx</i> + 2, where <i>k</i> is a constant, passes through the point (4, 14). What is the <i>x</i>-intercept of the line?`,c:["−3/2","−2/3","2/3","3"],a:1,x:`14 = 4<i>k</i> + 2 → <i>k</i> = 3. Set <i>y</i> = 0: 0 = 3<i>x</i> + 2 → <i>x</i> = −2/3.`},
{id:"mh8",s:"m",d:"Algebra",k:"Absolute value",mod:"H",q:`What is the sum of the solutions to |2<i>x</i> − 5| = 9?`,c:["2","5","7","9"],a:1,x:`2<i>x</i> − 5 = 9 gives <i>x</i> = 7; 2<i>x</i> − 5 = −9 gives <i>x</i> = −2. Sum: 7 + (−2) = 5.`},
{id:"mh9",s:"m",d:"Advanced Math",k:"Quadratics",mod:"H",t:"gi",ans:[9],q:`In the equation <i>x</i><sup>2</sup> − 6<i>x</i> + <i>k</i> = 0, <i>k</i> is a constant. If the equation has exactly one real solution, what is the value of <i>k</i>?`,x:`One solution means the discriminant is zero: (−6)<sup>2</sup> − 4(1)(<i>k</i>) = 0 → 36 = 4<i>k</i> → <i>k</i> = <b>9</b>. Check: <i>x</i><sup>2</sup> − 6<i>x</i> + 9 = (<i>x</i> − 3)<sup>2</sup>.`},
{id:"mh10",s:"m",d:"Advanced Math",k:"Quadratics",mod:"H",q:`The function <i>f</i> is defined by <i>f</i>(<i>x</i>) = (<i>x</i> − 2)(<i>x</i> + 4). For what value of <i>x</i> does <i>f</i> reach its minimum?`,c:["−4","−1","1","2"],a:1,x:`The zeros are 2 and −4, and the vertex sits halfway between them: (2 + (−4)) ÷ 2 = −1. Desmos shows this instantly.`},
{id:"mh11",s:"m",d:"Advanced Math",k:"Exponents",mod:"H",q:`For <i>x</i> ≠ 0, which expression is equivalent to (<i>x</i><sup>5</sup> · <i>x</i><sup>−2</sup>) ÷ <i>x</i><sup>4</sup>?`,c:["<i>x</i>","1/<i>x</i>","<i>x</i><sup>2</sup>","1/<i>x</i><sup>2</sup>"],a:1,x:`Add exponents when multiplying (5 + (−2) = 3), subtract when dividing (3 − 4 = −1). <i>x</i><sup>−1</sup> = 1/<i>x</i>.`},
{id:"mh12",s:"m",d:"Advanced Math",k:"Rational equations",mod:"H",t:"gi",ans:[5],q:`What value of <i>x</i> satisfies 3/(<i>x</i> − 2) = 6/(<i>x</i> + 1)?`,x:`Cross-multiply: 3(<i>x</i> + 1) = 6(<i>x</i> − 2) → 3<i>x</i> + 3 = 6<i>x</i> − 12 → 15 = 3<i>x</i> → <i>x</i> = <b>5</b>. It doesn't make either denominator zero, so it's valid.`},
{id:"mh13",s:"m",d:"Advanced Math",k:"Exponential functions",mod:"H",q:`The value of a car <i>t</i> years after purchase is modeled by <i>V</i>(<i>t</i>) = 24,000(0.85)<sup><i>t</i></sup>. Which statement best describes the meaning of 0.85 in this model?`,c:["The car's value decreases by $0.85 each year.","The car's value decreases by 85% each year.","The car's value decreases by 15% each year.","The car's value is 85% of its original value after 15 years."],a:2,x:`Multiplying by 0.85 keeps 85% each year, which means losing 15% each year.`},
{id:"mh14",s:"m",d:"Advanced Math",k:"Function notation",mod:"H",q:`The function <i>g</i> is defined by <i>g</i>(<i>x</i>) = <i>x</i><sup>2</sup> + <i>bx</i> + 10, where <i>b</i> is a constant. If <i>g</i>(2) = 4, what is the value of <i>b</i>?`,c:["−7","−5","5","7"],a:1,x:`4 + 2<i>b</i> + 10 = 4 → 2<i>b</i> = −10 → <i>b</i> = −5.`},
{id:"mh15",s:"m",d:"Advanced Math",k:"Nonlinear systems",mod:"H",q:`<i>y</i> = <i>x</i><sup>2</sup> − 4<i>x</i> + 7<br><i>y</i> = 2<i>x</i> − 2<br>How many points of intersection do the graphs of these equations have?`,c:["Zero","Exactly one","Exactly two","Infinitely many"],a:1,x:`Set equal: <i>x</i><sup>2</sup> − 6<i>x</i> + 9 = 0 → (<i>x</i> − 3)<sup>2</sup> = 0. One solution, so the line touches the parabola once (at (3, 4)).`},
{id:"mh16",s:"m",d:"Problem-Solving & Data Analysis",k:"Percentages",mod:"H",q:`The price of a jacket was increased by 20%. Later, the new price was decreased by 20%. How does the final price compare with the original price?`,c:["It is the same.","It is 4% less.","It is 4% more.","It is 20% less."],a:1,x:`1.20 × 0.80 = 0.96, so the final price is 96% of the original: 4% less. The percentages apply to different starting amounts, so they don't cancel.`},
{id:"mh17",s:"m",d:"Problem-Solving & Data Analysis",k:"Mean and median",mod:"H",t:"gi",ans:[30],q:`The mean of 5 numbers is 18. When a sixth number is added, the mean of the 6 numbers is 20. What is the sixth number?`,x:`Original total: 5 × 18 = 90. New total: 6 × 20 = 120. The sixth number is 120 − 90 = <b>30</b>.`},
{id:"mh18",s:"m",d:"Problem-Solving & Data Analysis",k:"Sampling and inference",mod:"H",q:`A random sample of 400 voters in a city found that 52% support a proposal. The margin of error for the estimate is 4 percentage points. Which conclusion is most appropriate?`,c:["The percentage of all voters in the city who support the proposal is plausibly between 48% and 56%.","Exactly 52% of all voters in the city support the proposal.","More than half of all voters in the city definitely support the proposal.","The proposal will pass with 56% of the vote."],a:0,x:`A margin of error gives a plausible range: 52 ± 4. Since the range dips below 50%, you can't say "definitely more than half."`},
{id:"mh19",s:"m",d:"Problem-Solving & Data Analysis",k:"Rates",mod:"H",q:`A water tank is filled at a constant rate of 12 liters per minute. How many hours will it take to fill an empty tank that holds 2,160 liters?`,c:["2","3","18","180"],a:1,x:`2,160 ÷ 12 = 180 minutes, and 180 ÷ 60 = 3 hours. The 180 trap forgets to convert units.`},
{id:"mh20",s:"m",d:"Geometry & Trigonometry",k:"Similar triangles",mod:"H",t:"gi",ans:[125],q:`Triangle <i>ABC</i> is similar to triangle <i>DEF</i>, where side <i>AB</i> corresponds to side <i>DE</i>. If <i>AB</i> = 6, <i>DE</i> = 15, and the area of triangle <i>ABC</i> is 20, what is the area of triangle <i>DEF</i>?`,x:`The scale factor is 15/6 = 2.5. Areas scale by the <i>square</i> of the factor: 2.5<sup>2</sup> = 6.25, and 20 × 6.25 = <b>125</b>.`},
{id:"mh21",s:"m",d:"Geometry & Trigonometry",k:"Circles",mod:"H",q:`A circle in the <i>xy</i>-plane has equation <i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> − 6<i>x</i> + 8<i>y</i> = 0. What is the radius of the circle?`,c:["5","10","25","√14"],a:0,x:`Complete the square: (<i>x</i> − 3)<sup>2</sup> − 9 + (<i>y</i> + 4)<sup>2</sup> − 16 = 0 → (<i>x</i> − 3)<sup>2</sup> + (<i>y</i> + 4)<sup>2</sup> = 25. The radius is √25 = 5.`},
{id:"mh22",s:"m",d:"Geometry & Trigonometry",k:"Trigonometry",mod:"H",q:`In right triangle <i>ABC</i>, angle <i>C</i> is the right angle, tan <i>A</i> = 5/12, and the hypotenuse <i>AB</i> = 26. What is the length of side <i>BC</i>?`,c:["10","12","20","24"],a:0,x:`tan <i>A</i> = opposite/adjacent = <i>BC</i>/<i>AC</i> = 5/12, so the sides are 5<i>k</i>, 12<i>k</i>, 13<i>k</i>. 13<i>k</i> = 26 → <i>k</i> = 2, so <i>BC</i> = 5 × 2 = 10.`},
/* ===== Expansion: Craft & Structure (non-vocab) ===== */
{id:"rw28",s:"rw",d:"Craft & Structure",k:"Text structure and purpose",mod:"1",
 p:`<p>Many people picture glaciers as frozen and motionless. In fact, glaciers flow downhill like extremely slow rivers, moving anywhere from a few centimeters to several meters per day. This movement lets glaciers carve valleys and carry boulders far from where they started.</p>`,
 q:`Which choice best describes the function of the first sentence in the overall structure of the text?`,
 c:["It introduces a common perception that the rest of the text corrects.","It states the main claim that the rest of the text supports.","It describes how scientists measure the speed of glaciers.","It summarizes the effects of glacier movement."],a:0,
 x:`"Many people picture" sets up a belief, and "In fact" immediately corrects it. The first sentence is the misconception, not the claim the text supports.`},
{id:"rw29",s:"rw",d:"Craft & Structure",k:"Cross-text connections",mod:"1",
 p:`<p><b>Text 1</b><br>Some educators argue that handwriting instruction is outdated now that most students type their assignments.</p><p><b>Text 2</b><br>In a recent study, students who took notes by hand remembered lecture content better than students who typed. The researchers suggest that writing by hand forced students to summarize ideas rather than copy them word for word.</p>`,
 q:`Based on the texts, how would the author of Text 2 most likely respond to the educators in Text 1?`,
 c:["By suggesting that handwriting may offer learning benefits that typing does not","By agreeing that handwriting instruction no longer serves any purpose","By claiming that typing is always faster than writing by hand","By arguing that students should stop taking notes during lectures"],a:0,
 x:`Text 2 found a memory advantage for handwritten notes, which pushes back on the idea that handwriting is outdated.`},
{id:"rw30",s:"rw",d:"Craft & Structure",k:"Text structure and purpose",mod:"1",
 p:`<p>The following text is adapted from a short story. Nora has just finished her first shift running the family bakery on her own.</p><p>When the last customer left, Nora flipped the sign to CLOSED and leaned against the counter. The display cases were nearly empty, flour dusted her sleeves, and her feet ached. She smiled anyway; for the first time, the whole day had been hers to manage.</p>`,
 q:`Which choice best states the main purpose of the text?`,
 c:["To convey Nora's tired but satisfied feelings after a day of work","To describe the bakery's products in detail","To explain why Nora decided to close the bakery early","To show that Nora dislikes working at the bakery"],a:0,
 x:`The aching feet and flour show she's tired; "she smiled anyway" and "hers to manage" show satisfaction. Both halves are needed.`},
{id:"rwe28",s:"rw",d:"Craft & Structure",k:"Text structure and purpose",mod:"E",
 p:`<p>Some people think bats are blind. In fact, most bats can see, and many species also use echolocation, making sounds and listening for the echoes to find insects in the dark.</p>`,
 q:`Which choice best describes the function of the first sentence?`,
 c:["It presents a mistaken belief that the next sentence corrects.","It states a fact that the rest of the text proves.","It explains how echolocation works.","It describes what bats eat."],a:0,
 x:`"In fact" signals a correction, so the first sentence is the mistaken belief.`},
{id:"rwe29",s:"rw",d:"Craft & Structure",k:"Text structure and purpose",mod:"E",
 p:`<p>The school garden club meets every Tuesday after school. Members plant vegetables, water the beds, and donate the harvest to a local food pantry. New members are always welcome, and no experience is needed.</p>`,
 q:`Which choice best states the main purpose of the text?`,
 c:["To inform students about the garden club and invite them to join","To argue that gardening is too difficult for beginners","To describe the history of the local food pantry","To compare the garden club with other school clubs"],a:0,
 x:`It describes what the club does and ends with "new members are always welcome," which is an invitation.`},
{id:"rwe30",s:"rw",d:"Craft & Structure",k:"Cross-text connections",mod:"E",
 p:`<p><b>Text 1</b><br>Some people believe that video games are nothing more than a waste of time.</p><p><b>Text 2</b><br>Several studies have found that certain action video games can improve players' reaction times and their ability to track several moving objects at once.</p>`,
 q:`Based on the texts, how would the author of Text 2 most likely respond to the view in Text 1?`,
 c:["By pointing to evidence that some video games may have benefits","By agreeing that all video games are a waste of time","By claiming that video games improve every school subject","By arguing that video games should be banned"],a:0,
 x:`Text 2 cites measurable benefits for "certain" games, which challenges the "nothing more than a waste of time" view without overclaiming.`},
{id:"rwh28",s:"rw",d:"Craft & Structure",k:"Text structure and purpose",mod:"H",
 p:`<p>For much of the twentieth century, scholars attributed the decline of the Classic Maya cities to a single cause, such as warfare or disease. Analyses of lake sediments, however, have revealed a series of severe droughts during the period of decline. Many researchers now argue that drought interacted with warfare and political instability rather than acting alone.</p>`,
 q:`Which choice best describes the overall structure of the text?`,
 c:["It describes an older explanation, introduces new evidence, and presents a more complex explanation that incorporates that evidence.","It presents a theory and then offers evidence that confirms it completely.","It compares how two civilizations responded to drought.","It describes a research method and then explains its limitations."],a:0,
 x:`Three moves: single-cause view → sediment evidence of drought → drought combined with other causes. The new view doesn't simply confirm the old one.`},
{id:"rwh29",s:"rw",d:"Craft & Structure",k:"Cross-text connections",mod:"H",
 p:`<p><b>Text 1</b><br>Psychologist Dana Kim argues that people's memories of highly emotional events are especially accurate, because strong emotions focus attention on what is happening.</p><p><b>Text 2</b><br>In studies of so-called flashbulb memories, people recalled emotional public events with great confidence. Yet when researchers compared these accounts with ones the same people had written shortly after the events, many details had changed, even though participants' confidence remained high.</p>`,
 q:`Based on the texts, how would the researchers in Text 2 most likely respond to Kim's argument in Text 1?`,
 c:["By arguing that confidence in emotional memories does not mean those memories are accurate","By agreeing that strong emotions make memories more accurate","By claiming that people cannot remember emotional events at all","By suggesting that participants should have written their accounts later"],a:0,
 x:`Text 2 shows details changing while confidence stayed high. That separates confidence from accuracy, which undercuts Kim's claim. It doesn't say people remember nothing.`},
{id:"rwh30",s:"rw",d:"Craft & Structure",k:"Text structure and purpose",mod:"H",
 p:`<p>The experimental drug reduced symptoms in 70 percent of trial participants, but the trial included only forty adults, all between the ages of 30 and 45. The researchers therefore described their results as "promising but preliminary."</p>`,
 q:`Which choice best describes the relationship between the two sentences?`,
 c:["The first sentence presents details that the second sentence uses to justify a cautious conclusion.","The first sentence states a conclusion that the second sentence rejects.","The second sentence introduces evidence that contradicts the first sentence.","The second sentence describes a method the researchers used in the first sentence."],a:0,
 x:`"Therefore" ties the small, narrow sample (sentence 1) to the cautious label (sentence 2). The second sentence doesn't reject the result; it qualifies it.`},

{id:"rw31",s:"rw",d:"Information & Ideas",k:"Central ideas",mod:"1",
 p:`<p>In many cities, rooftop gardens do more than grow vegetables. Soil and plants absorb rainwater that would otherwise flood storm drains, and they insulate buildings, lowering summer cooling costs. Some studies have even found that green roofs can lower the surrounding air temperature by a few degrees.</p>`,

{id:"rw32",s:"rw",d:"Information & Ideas",k:"Inferences",mod:"1",
 p:`<p>Archaeologists found that pottery at an ancient village site was made from a type of clay that does not occur within 200 kilometers of the village. No kilns or clay-shaping tools were found at the site. These findings suggest that the village's residents ______</p>`,

{id:"rw33",s:"rw",d:"Information & Ideas",k:"Command of evidence (textual)",mod:"1",

{id:"rw34",s:"rw",d:"Information & Ideas",k:"Central ideas",mod:"1",
 p:`<p>The tardigrade, a microscopic animal about half a millimeter long, can survive conditions that would kill most living things. When its environment dries out, it curls into a dormant state and loses almost all of its body water. In this state, tardigrades have survived extreme cold, high doses of radiation, and even exposure to the vacuum of space.</p>`,

{id:"rw35",s:"rw",d:"Information & Ideas",k:"Command of evidence (textual)",mod:"1",
 p:`<p>An ecologist claims that a city's new limits on nighttime building lights have helped migrating birds.</p>`,
 q:`Which finding, if true, would most strongly support the ecologist's claim?`,

{id:"rwe31",s:"rw",d:"Information & Ideas",k:"Central ideas",mod:"E",
 p:`<p>Honey almost never spoils. Its low water content and natural acidity make it very hard for bacteria to grow. Archaeologists have even found pots of honey in ancient tombs that were still edible.</p>`,

{id:"rwe32",s:"rw",d:"Information & Ideas",k:"Inferences",mod:"E",

{id:"rwe33",s:"rw",d:"Information & Ideas",k:"Command of evidence (textual)",mod:"E",

{id:"rwe34",s:"rw",d:"Information & Ideas",k:"Central ideas",mod:"E",

{id:"rwe35",s:"rw",d:"Information & Ideas",k:"Central ideas",mod:"E",

{id:"rwh31",s:"rw",d:"Information & Ideas",k:"Central ideas",mod:"H",
 p:`<p>The following text is adapted from a short story.</p><p>Ines had rehearsed the apology for a week, polishing each sentence until it gleamed. But when her brother opened the door, looking older than she remembered, the words seemed to belong to someone else. She said only his name, and he stepped aside to let her in.</p>`,
 q:`Which choice best states the main idea of the text?`,

 x:`The rehearsed speech "seemed to belong to someone else," so she says only his name, and he lets her in. Nothing suggests anger or refusal.`},
{id:"rwh32",s:"rw",d:"Information & Ideas",k:"Inferences",mod:"H",
 p:`<p>Researchers compared two populations of the same snail species. Snails from a lake containing crayfish, which crush snail shells, had thicker shells than snails from a nearby lake without crayfish. When young snails from the crayfish-free lake were raised in water that had previously held crayfish, but with no crayfish present, they also developed thicker shells. These results suggest that ______</p>`,
 q:`Which choice most logically completes the text?`,
 c:["the snails can respond to chemical cues from crayfish by growing thicker shells.","shell thickness is determined entirely by genes inherited from parents.","crayfish prefer to eat snails with thin shells.","the crayfish-free lake contains less calcium than the other lake."],a:0,
 x:`Snails from the same thin-shelled population grew thicker shells just from crayfish-scented water, so something in the water triggered it. That rules out "entirely genetic."`},
{id:"rwh33",s:"rw",d:"Information & Ideas",k:"Command of evidence (textual)",mod:"H",
 p:`<p>A historian argues that the rapid spread of radio ownership in one country during the 1920s was driven more by falling prices than by rising incomes.</p>`,
 q:`Which finding, if true, would most directly support the historian's argument?`,

{id:"rwh34",s:"rw",d:"Information & Ideas",k:"Command of evidence (textual)",mod:"H",
 p:`<p>A nutrition researcher hypothesizes that a coastal town's low rate of heart disease results mainly from residents' frequent consumption of a particular local fish.</p>`,

{id:"rwh35",s:"rw",d:"Information & Ideas",k:"Central ideas",mod:"H",
 p:`<p>Most stars form in clusters, but the stars in a cluster gradually drift apart over hundreds of millions of years. Astronomers have identified groups of widely scattered stars that share nearly identical chemical compositions and motions through the galaxy. By tracing these motions backward, researchers can determine that such stars likely formed together in a single cluster long ago.</p>`,

{id:"rwe36",s:"rw",d:"Expression of Ideas",k:"Rhetorical synthesis",mod:"E",

/* Stable shuffle of Reading & Writing choices so the correct answer isn't always in the same position */
function hashStr(s){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function seeded(seed){ return ()=>{ seed=(seed+0x6D2B79F5)|0; let t=Math.imul(seed^(seed>>>15),1|seed); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
QS.forEach(q=>{ if(q.s!=="rw"||!q.c) return; const r=seeded(hashStr(q.id+"psat")); const idx=[0,1,2,3];
  for(let i=3;i>0;i--){ const j=Math.floor(r()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  q.c=idx.map(i=>q.c[i]); q.a=idx.indexOf(q.a); });

const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

Object.entries(journal).forEach(([id,j])=>{ if(j && j.q) byId[id]=j.q; });

const app = document.getElementById("app");

function parseNum(s){
  s = String(s||"").trim().replace(/\s/g,"").replace(/−/g,"-");
  if(!s) return NaN;
  if(s.includes("/")){ const [a,b] = s.split("/"); return Number(a)/Number(b); }
  return Number(s);
}
function isRight(q, ans){
  if(ans===undefined || ans===null || ans==="") return false;
  if(q.t==="gi"){ const v=parseNum(ans); return q.ans.some(t=>Math.abs(v-t)<1e-3); }
  return ans===q.a;
}
function fmt(sec){ sec=Math.max(0,sec); return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"); }
function pct(c,t){ return t? Math.round(100*c/t) : 0; }
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } if(brkId){ clearInterval(brkId); brkId=null; } }
function top0(){ window.scrollTo(0,0); }
function estimate(route,c,t){
  const p = t? c/t : 0;
  const raw = route==="H" ? 160 + 600*(0.30 + 0.70*p) : 160 + 450*p;
  return Math.min(760, Math.max(160, Math.round(raw/10)*10));
}
function saveSession(){ if(S && S.mode==="test") store.set("ppr_session",S); }
function curId(){ return S.mode==="test" ? S.cur.qs[S.idx] : S.qs[S.idx]; }

function go(v){ stopTimer(); saveSession(); S=null; view=v; render(); top0(); }

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current", String(b.dataset.v===view || (view==="drill"&&b.dataset.v==="drillpick"))));
  const f = {home, drillpick, journal:journalView, strategy, test:testView, m2intro:m2View, brk:breakView, results:resultsView, drill:drillView, drilldone:drillDone}[view] || home;
  app.innerHTML = f();
  const gi = document.getElementById("gi");
  if(gi) gi.addEventListener("input", e=>{
    const id=curId(); S.ans[id]=e.target.value; saveSession();
    const cb=document.querySelector('[data-act="check"]'); if(cb) cb.disabled=!e.target.value.trim();
    const pv=document.getElementById("gipv");
    if(pv){ const n=parseNum(e.target.value); pv.textContent = e.target.value ? (isNaN(n)?"Not a valid number yet":"Answer preview: "+e.target.value) : "Enter a whole number, decimal, or fraction. Use - for negatives."; }
  });
}

/* ---------- Adaptive test engine ---------- */
function modQs(s,mod){
  const list = QS.filter(q=>q.s===s && q.mod===mod);
  if(s==="rw") return DOMS.rw.flatMap(d=>list.filter(q=>q.d===d)).map(q=>q.id);
  const b = DOMS.m.map(d=>list.filter(q=>q.d===d)), out=[];
  while(b.some(x=>x.length)) b.forEach(x=>{ if(x.length) out.push(x.shift()); });
  return out.map(q=>q.id);
}
function mkMod(s,mod){ const qs=buildModule(s,mod); if(S){ S.gen=S.gen||{}; qs.forEach(id=>{ if(byId[id].gen) S.gen[id]=byId[id]; }); } return {s, mod, qs, limit:MODTIME[s]}; }
function startTest(m){
  store.del("ppr_session"); window.__discardAsk=false;
  const secs = m==="full" ? ["rw","m"] : [m];
  S = {mode:"test", label: m==="full"?"Full adaptive test":SECNAME[m]+" section", secs, si:0, done:[], route:{},
       ans:{}, flag:{}, strike:{}, hideT:false, phase:"test", gen:{}, idx:0, left:MODTIME[secs[0]]};
  S.cur=mkMod(secs[0],"1");
  beginModule(true);
}
function beginModule(fresh){
  if(fresh){ S.idx=0; S.left=S.cur.limit; }
  S.review=false; S.nav=false; S.confirm=false; S.phase="test";
  view="test"; saveSession(); render(); top0();
  stopTimer();
  timerId = setInterval(()=>{
    S.left--;
    const t=document.getElementById("timer");
    if(t){ t.textContent = S.hideT? "Timer hidden" : fmt(S.left); t.classList.toggle("warn", S.left<=300 && !S.hideT); }
    if(S.left%5===0) saveSession();
    if(S.left<=0) finishModule();
  },1000);
}
function finishModule(){
  stopTimer();
  const cur = S.cur;
  cur.used = cur.limit - Math.max(0,S.left);
  cur.c = cur.qs.filter(id=>isRight(byId[id],S.ans[id])).length;
  S.done.push(cur);
  if(cur.mod==="1"){
    S.route[cur.s] = cur.c >= ROUTE_MIN[cur.s] ? "H" : "E";
    S.cur = mkMod(cur.s, S.route[cur.s]); S.phase="m2intro";
  } else if(S.si < S.secs.length-1){
    S.si++; S.cur = mkMod(S.secs[S.si],"1"); S.phase="brk"; S.brkLeft=600;
  } else { grade(); return; }
  S.idx=0; S.left=S.cur.limit;
  saveSession(); view=S.phase; render(); top0();
  if(S.phase==="brk") startBreak();
}
function startBreak(){
  stopTimer();
  brkId = setInterval(()=>{
    S.brkLeft = Math.max(0,(S.brkLeft||0)-1);
    const el=document.getElementById("brk"); if(el) el.textContent = S.brkLeft? fmt(S.brkLeft) : "Break over";
    if(S.brkLeft%5===0) saveSession();
    if(!S.brkLeft){ clearInterval(brkId); brkId=null; }
  },1000);
}
function addMiss(id){ const j=journal[id]||{r:"",n:0,m:false}; j.n++; j.m=false; if(byId[id]&&byId[id].gen) j.q=byId[id]; journal[id]=j; }
function grade(){
  const secs = S.secs.map(s=>{
    const mods = S.done.filter(d=>d.s===s);
    const items = mods.flatMap(md=>md.qs.map(id=>({id, a:S.ans[id], ok:isRight(byId[id],S.ans[id]), mod:md.mod})));
    const c = items.filter(i=>i.ok).length, t = items.length;
    return {s, route:S.route[s], mods:mods.map(md=>({mod:md.mod,c:md.c,t:md.qs.length,used:md.used})), items, c, t, score:estimate(S.route[s],c,t)};
  });
  secs.forEach(x=>x.items.forEach(i=>{ if(!i.ok) addMiss(i.id); }));
  store.set("ppr_journal",journal);
  hist.push({date:Date.now(), label:S.label, parts:secs.map(x=>({s:x.s,c:x.c,t:x.t,score:x.score}))});
  store.set("ppr_hist2",hist);
  R = {label:S.label, secs};
  store.del("ppr_session"); S=null; view="results"; render(); top0();
}

/* ---------- Question rendering ---------- */
function choiceHTML(q, id, chosen, opts={}){
  if(q.t==="gi"){
    const v = chosen ?? "";
    return `<div class="gi"><label for="gi" class="skill">Your answer</label><input id="gi" inputmode="text" autocomplete="off" maxlength="6" value="${String(v).replace(/"/g,"")}" ${opts.lock?"disabled":""}><small id="gipv">${v?"Answer preview: "+v:"Enter a whole number, decimal, or fraction. Use - for negatives."}</small></div>`;
  }
  const st = (S.strike&&S.strike[id])||{};
  return `<div class="choices" role="radiogroup">${q.c.map((c,i)=>{
    let cls="opt"; if(chosen===i) cls+=" sel"; if(st[i]) cls+=" struck";
    if(opts.lock){ if(i===q.a) cls+=" right"; else if(chosen===i) cls+=" wrong"; }
    return `<div class="choice"><button class="${cls}" role="radio" aria-checked="${chosen===i}" data-act="pick" data-i="${i}" ${opts.lock?"disabled":""}><span class="bub">${L[i]}</span><span class="txt">${c}</span></button>${opts.noStrike?"":`<button class="strike" aria-label="Cross out choice ${L[i]}" aria-pressed="${!!st[i]}" data-act="strike" data-i="${i}">${L[i]}̶</button>`}</div>`;
  }).join("")}</div>`;
}
const FLAGSVG = `<svg viewBox="0 0 14 16" aria-hidden="true"><path d="M1 1h11l-3 4 3 4H1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M1 1v14" stroke="currentColor" stroke-width="1.6"/></svg>`;

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startDrill(ids,label,max=10){

  view="drill"; render(); top0();
}
function drillView(){

/* ---------- Journal ---------- */
const REASONS = ["Didn't know the rule or concept","Misread the question","Careless slip","Fell for a trap answer","Ran out of time","Guessed"];
const REASON_TIP = {
  "Didn't know the rule or concept":"Content gap. Drill that skill area and reread the explanations until you could teach the rule.",
  "Misread the question":"Slow down on the last line of each question. Underline what it actually asks (the larger angle, the value of 6x, from those in band).",
  "Careless slip":"Write one more line of work on scratch paper, and plug your answer back in when there's time.",
  "Fell for a trap answer":"Trap answers are built from the most common mistake. Predict your own answer before looking at the choices.",
  "Ran out of time":"Practice skipping: if a question takes more than 2 minutes, guess, mark it, and come back.",
  "Guessed":"Treat guesses as misses. Drill the skill until the guess becomes a known answer."};
function journalView(){
  const open = Object.entries(journal).filter(([id,j])=>!j.m && byId[id]);
  const mastered = Object.values(journal).filter(j=>j.m).length;
  if(!open.length) return `<div class="panel stack" style="max-width:640px;margin:0 auto"><p class="eyebrow">Mistake journal</p><h2>${mastered?"Everything in here is mastered.":"Nothing here yet."}</h2><p class="lede" style="font-size:1rem">${mastered?`${mastered} question${mastered>1?"s":""} retried and answered correctly.`:"Missed questions from tests and drills will show up here so you can tag why they happened and retry them."}</p><div class="row"><button class="btn primary" data-act="start" data-m="full">Take the full test</button><button class="btn" data-act="go" data-v="drillpick">Do a drill</button></div></div>`;
  const counts={}; open.forEach(([,j])=>{ if(j.r) counts[j.r]=(counts[j.r]||0)+1; });
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  const tagged = Object.values(counts).reduce((a,b)=>a+b,0);
  const items = open.map(([id,j])=>{ const q=byId[id]; const snippet = q.p ? q.p.replace(/<div class="scroll">[\s\S]*?<\/div>/g," [table] ").replace(/<[^>]+>/g," ").trim().slice(0,170)+"…" : q.q.replace(/<div class="scroll">[\s\S]*?<\/div>/g,"[table] ");
    return `<div class="jitem"><div class="row"><span class="skill">${SECNAME[q.s]} · ${q.k}</span>${j.n>1?`<span class="count">missed ${j.n}×</span>`:""}</div>
    <p class="stem">${snippet}</p>
    <label class="row" style="gap:8px"><span class="skill" style="text-transform:none;letter-spacing:0">Why I missed it</span><select id="r-${id}" data-reason="${id}"><option value="">Choose a reason</option>${REASONS.map(r=>`<option ${j.r===r?"selected":""}>${r}</option>`).join("")}</select></label></div>`; }).join("");
  return `<div class="stack"><div class="hero" style="padding-bottom:4px"><p class="eyebrow">Mistake journal</p><h1>${open.length} to fix${mastered?`, ${mastered} mastered`:""}.</h1>
    <p class="lede" style="font-size:1rem">A question leaves the journal when you get it right on a retry.</p></div>
    ${top?`<div class="panel stack" style="gap:6px;border:1.5px solid var(--ink)"><p class="eyebrow">Your pattern so far (${tagged} tagged)</p><h3>Most common: ${top[0]} (${top[1]})</h3><p style="font-family:var(--body)">${REASON_TIP[top[0]]}</p></div>`:`<div class="confirm">Tag each miss below. Once a few are tagged, the journal shows which habit is costing the most points.</div>`}
    <div class="row"><button class="btn primary" data-act="retry">Retry ${Math.min(open.length,15)} of ${open.length}</button></div>
    <div class="panel">${items}</div></div>`;
}

/* ---------- Strategy ---------- */
function strategy(){
  return `<div class="stack"><div class="hero" style="padding-bottom:4px"><p class="eyebrow">Strategy</p><h1>Good grades and a low PSAT score usually point to test habits, not ability.</h1>
  <p class="lede">School rewards thoroughness and outside knowledge. The PSAT rewards speed, literal reading, and dodging answers designed to look right. These are learnable.</p></div>
  <div class="tips">
    <div class="tip"><span class="tag">ADAPTIVE</span><h3>Module 1 matters most</h3><p>Your Module 1 accuracy decides whether Module 2 is the harder version. Only the harder Module 2 unlocks the top of the score range. Don't rush the first module to bank time.</p></div>
    <div class="tip"><span class="tag">READING</span><h3>The text proves it, or it's wrong</h3><p>Strong readers pick answers that are true, interesting, or insightful. The right answer is the one the passage directly supports. If you can't point to the line that proves it, eliminate it.</p></div>
    <div class="tip"><span class="tag">READING</span><h3>Predict before you peek</h3><p>Cover the choices and answer in your own words first (for a blank: "something like <i>accurate</i>"). Then find the match. This blocks trap answers from steering you.</p></div>

document.addEventListener("change", e=>{
  const id = e.target.dataset && e.target.dataset.reason;

});
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  switch(a){
    case "go": go(b.dataset.v); break;
    case "start": startTest(b.dataset.m); break;
    case "resume": { S = store.get("ppr_session",null); if(!S) return render(); Object.values(S.gen||{}).forEach(q=>{ byId[q.id]=q; });
      if(S.phase==="test") beginModule(false);
      else { view=S.phase; render(); top0(); if(S.phase==="brk") startBreak(); } break; }
    case "discardask": window.__discardAsk=true; render(); break;
    case "discardno": window.__discardAsk=false; render(); break;
    case "discard": window.__discardAsk=false; store.del("ppr_session"); render(); break;
    case "pick": { const id=curId(); if(S.mode==="drill"&&S.checked[id]) return; const i=+b.dataset.i; S.ans[id] = (S.ans[id]===i && S.mode==="test")? undefined : i; if(S.strike[id]) S.strike[id][i]=false; saveSession(); render(); break; }
    case "strike": { const id=curId(); S.strike[id]=S.strike[id]||{}; const i=+b.dataset.i; S.strike[id][i]=!S.strike[id][i]; if(S.strike[id][i]&&S.ans[id]===i) S.ans[id]=undefined; saveSession(); render(); break; }
    case "flag": { const id=curId(); S.flag[id]=!S.flag[id]; saveSession(); render(); break; }
    case "hidet": S.hideT=!S.hideT; render(); break;
    case "nav": S.nav=!S.nav; render(); break;
    case "jump": S.idx=+b.dataset.i; S.review=false; S.nav=false; S.confirm=false; saveSession(); render(); top0(); break;
    case "next": { const n=S.cur.qs.length; if(S.idx<n-1) S.idx++; else S.review=true; S.nav=false; saveSession(); render(); top0(); break; }
    case "back": if(S.review){ S.review=false; S.confirm=false; } else if(S.idx>0) S.idx--; render(); top0(); break;
    case "askconfirm": S.confirm=true; render(); break;
    case "noconfirm": S.confirm=false; render(); break;
    case "submit": finishModule(); break;
    case "beginm2": beginModule(true); break;
    case "beginmath": beginModule(true); break;
    case "drilldom": startDrill(drillPool(b.dataset.d), b.dataset.d); break;
    case "drillsec": startDrill(DOMS[b.dataset.s].flatMap(d=>drillPool(d).slice(0,4)), "Mixed "+SECNAME[b.dataset.s], 12); break;
    case "check": { const id=curId(); S.checked[id]=true; const q=byId[id];
      if(isRight(q,S.ans[id])){ if(journal[id]) journal[id].m=true; } else addMiss(id);
      store.set("ppr_journal",journal); render(); break; }
    case "dnext": if(S.idx<S.qs.length-1){ S.idx++; render(); top0(); } else { view="drilldone"; render(); top0(); } break;
    case "retry": startDrill(Object.keys(journal).filter(id=>!journal[id].m && byId[id]), "Mistake retry", 15); break;
  }
});

let GSEQ = 0;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
function frac(n,d){ if(d<0){n=-n;d=-d;} const g=gcd(n,d); n/=g; d/=g; return d===1? n2s(n) : n2s(n)+"/"+d; }
function mcNum(correct, ds, show=n2s){
  const set=[correct];
  ds.forEach(d=>{ if(set.length<4 && Number.isFinite(d) && !set.includes(d)) set.push(d); });
  for(let k=1; set.length<4; k++) [correct+k, correct-k].forEach(c=>{ if(set.length<4 && !set.includes(c)) set.push(c); });
  set.sort((a,b)=>a-b);
  return {c:set.map(show), a:set.indexOf(correct)};
}
function mcText(correct, ds){
  const set=[correct];
  ds.forEach(d=>{ if(set.length<4 && d!==undefined && !set.includes(d)) set.push(d); });
  let k=0; while(set.length<4){ set.push(correct+" "+"​".repeat(++k)); }
  const arr=shuffle(set);
  return {c:arr, a:arr.indexOf(correct)};
}
function mk(base,s,d,k,tier){ return Object.assign({id:"g"+Date.now().toString(36)+"-"+(GSEQ++)+"-"+ri(100,999), s, d, k, mod:tier, gen:true}, base); }
const A_="Algebra", AM="Advanced Math", PS="Problem-Solving & Data Analysis", GT="Geometry & Trigonometry", SE="Standard English Conventions";

/* ---------- Algebra ---------- */
function gLinEq(t){
  const a=ri(2,9), x=ri(2,12), b=ri(1,20), c=a*x+b;
  if(t==="E") return mk({q:`If ${a}${X} + ${b} = ${c}, what is the value of ${X}?`,...mcNum(x,[c-b, x+1, x+2]),
    x:`Subtract ${b} from both sides: ${a}${X} = ${c-b}. Divide by ${a}: ${X} = ${x}. The answer ${c-b} is the trap of stopping one step early.`},"m",A_,"Linear equations",t);
  if(t==="1"){ const n=ri(2,4), d=ri(1,9), ans=n*a*x-d;
    return mk({q:`If ${a}${X} + ${b} = ${c}, what is the value of ${n*a}${X} − ${d}?`,...mcNum(ans,[n*a*x, a*x-d, ans+2*d]),
    x:`${a}${X} = ${c-b}. Multiply by ${n}: ${n*a}${X} = ${n*(c-b)}. Subtract ${d}: ${ans}. You never need ${X} itself.`},"m",A_,"Linear equations",t); }
  const A=ri(2,6); let r; do{ r=ri(1,8); }while(r===A);
  const xv=pick([-6,-5,-4,-3,-2,2,3,4,5,6,7,8,9]), p=ri(1,6), q=pick([-9,-7,-5,-4,-2,2,3,5,6,8]);
  const s=A*(xv-p)+q-r*xv;
  return mk({t:"gi",ans:[xv],q:`What value of ${X} satisfies the equation ${A}(${X} − ${p})${term(q)} = ${r===1?"":r}${X}${s===0?"":term(s)}?`,
    x:`Distribute: ${A}${X} − ${A*p}${term(q)} = ${r===1?"":r}${X}${s===0?"":term(s)}. Collect the ${X}-terms on one side: ${n2s(A-r)}${X} = ${n2s(s+A*p-q)}, so ${X} = <b>${n2s(xv)}</b>.`},"m",A_,"Linear equations",t);
}
const UNITS=[["month","gym membership","m","sign-up fee"],["hour","kayak rental","h","deposit"],["day","car rental","d","booking fee"],["week","storage unit","w","setup fee"]];
function gLinModel(t){

  if(mode==="eq"){ const corr=`${C} = ${R}${V} + ${F}`;
    return mk({q:`A ${thing} costs a one-time ${fee} of $${F} plus $${R} per ${u}. Which equation gives the total cost ${C}, in dollars, for ${V} ${u}s?`,
      ...mcText(corr,[`${C} = ${F}${V} + ${R}`,`${C} = ${R+F}${V}`,`${C} = ${R}(${V} + ${F})`]),
      x:`The per-${u} cost multiplies ${V}; the one-time ${fee} is added once. Check with 1 ${u}: ${R} + ${F} = ${R+F}.`},"m",A_,"Linear models",t); }

      x:`${F} + ${R}${V} = ${T} → ${R}${V} = ${T-F} → ${V} = <b>${n}</b>.`},"m",A_,"Linear models",t); }

    ...mcText(`The cost per ${u}`,[`The one-time ${fee}`,`The total cost for ${R} ${u}s`,`The number of ${u}s`]),
    x:`${R} multiplies ${V}, so it is added once for every ${u}: the cost per ${u}. ${F} is the one-time ${fee}.`},"m",A_,"Linear models",t);
}
function gSlope(t){

function gSystem(t){

  if(t==="1"){ const P=pick([40,60,80,120,160,200]), d=pick([20,25,30]), e=pick([10,20]), s=P*(100-d)/100, f=s*(100-e)/100;
    return mk({q:`A jacket originally priced at $${P} is marked down ${d}%. At checkout, an additional ${e}% is taken off the sale price. What is the final price?`,
      ...mcNum(f,[P*(100-d-e)/100, s, f+5],money),
      x:`$${P} × ${(100-d)/100} = ${money(s)}, then ${money(s)} × ${(100-e)/100} = ${money(f)}. Stacked discounts don't add: ${d+e}% off would give ${money(P*(100-d-e)/100)}.`},"m",PS,"Percentages",t); }
  const p=pick([10,20,30,40,50]), loss=p*p/100;

    ...mcText(`It is ${loss}% less.`,[`It is the same.`,`It is ${loss}% more.`,`It is ${p}% less.`]),
    x:`${(100+p)/100} × ${(100-p)/100} = ${(100-loss)/100}, so the final price is ${100-loss}% of the original: ${loss}% less. The two changes apply to different amounts, so they don't cancel.`},"m",PS,"Percentages",t);
}
function gMean(t){

const TRIPLES=[[3,4,5],[5,12,13],[8,15,17],[7,24,25]];
function gPyth(t){
  const [a,b,c]=pick(TRIPLES), k=a===3?ri(1,5):ri(1,2);
  if(t!=="H") return mk({q:`A right triangle has legs of length ${k*a} and ${k*b}. What is the length of its hypotenuse?`,...mcNum(k*c,[k*a+k*b, k*c+2, k*c-2]),
    x:`${k*a}<sup>2</sup> + ${k*b}<sup>2</sup> = ${k*k*(a*a+b*b)}, and √${k*k*(a*a+b*b)} = ${k*c}. Faster: it's a ${a}-${b}-${c} triangle${k>1?" scaled by "+k:""}.`},"m",GT,"Right triangles",t);
  const m=ri(2,3);
  return mk({q:`In right triangle <i>ABC</i>, angle <i>C</i> is the right angle, tan <i>A</i> = ${a}/${b}, and the hypotenuse <i>AB</i> = ${m*c}. What is the length of side <i>BC</i>?`,
    ...mcNum(m*a,[m*b, a*b, m*a+m]),
    x:`tan <i>A</i> = opposite/adjacent = <i>BC</i>/<i>AC</i> = ${a}/${b}, so the sides are ${a}<i>k</i>, ${b}<i>k</i>, ${c}<i>k</i>. ${c}<i>k</i> = ${m*c} → <i>k</i> = ${m}, so <i>BC</i> = ${a} × ${m} = ${m*a}.`},"m",GT,"Trigonometry",t);
}
function gCircle(t){

      x: area?`<i>A</i> = π<i>r</i><sup>2</sup> = ${r*r}π. (${2*r}π is the circumference.)`:`<i>C</i> = 2π<i>r</i> = ${2*r}π. (${r*r}π is the area.)`},"m",GT,"Circles",t); }

    ...mcNum(r,[r*r, 2*r, Math.abs(h)+Math.abs(k)]),
    x:`Complete the square: (${X}${term(-h)})<sup>2</sup> − ${h*h} + (${Y}${term(-k)})<sup>2</sup> − ${k*k}${C0===0?"":term(C0)} = 0, so (${X}${term(-h)})<sup>2</sup> + (${Y}${term(-k)})<sup>2</sup> = ${r*r}. The radius is √${r*r} = <b>${r}</b>.`},"m",GT,"Circles",t);

function gAngle(t){

/* ---------- Standard English Conventions (sentence frames) ---------- */
const SECQ="Which choice completes the text so that it conforms to the conventions of Standard English?";
const secItem=(before,after,corr,ds,k,x,t)=>mk({p:`<p>${before} ______ ${after}</p>`,q:SECQ,...mcText(corr,ds),x},"rw",SE,k,t);
const F_SEMI=[["The hikers reached the summit just after","dawn","they could see three states from the top."],["Our neighbor grows tomatoes in her","backyard","she shares the extras with everyone on the street."],["The orchestra rehearsed for six","months","it performed the symphony without a single mistake."],["Marcus finally finished building the","birdhouse","he painted it bright blue."],["The researchers collected water samples from twelve","lakes","they found microplastics in every one."],["The city replaced its old streetlights with LED","fixtures","they use about half as much electricity."],["Saturn has more than one hundred known","moons","its largest, Titan, is bigger than the planet Mercury."],["The bakery opens at six in the","morning","it usually sells out of croissants by noon."]];
function gSemi(t){ const [a,w,b]=pick(F_SEMI);
  return secItem(a,b,w+";",[w+",",w,w+", which"],"Boundaries",`Both parts are complete sentences. Two independent clauses need a period or a semicolon between them. A comma alone creates a comma splice, and nothing at all creates a run-on.`,t); }
const F_COLON=[["The recipe requires only three","spices","cumin, paprika, and garlic powder."],["The museum's new wing focuses on two","periods","the Renaissance and the Baroque."],["To join the club, students need just one","thing","a willingness to try new foods."],["The team's success depended on two","players","a fast striker and a reliable goalkeeper."],["The garden is divided into four","sections","herbs, vegetables, flowers, and fruit trees."],["Every camper must bring the same basic","supplies","a sleeping bag, a flashlight, and a water bottle."]];
function gColon(t){ const [a,w,b]=pick(F_COLON);
  return secItem(a,b,w+":",[w+";",w+",",w],"Boundaries",`The part before the blank is a complete sentence, and what follows is a list or explanation of it. A colon introduces that. A semicolon would need a complete sentence after it.`,t); }
const F_NE=[["The Amazon River, which carries more water than any other river on","Earth","empties into the Atlantic Ocean."],["My grandmother, who learned to swim at the age of","seventy","now swims laps three times a week."],["The <i>Mona Lisa</i>, which hangs behind protective glass in the","Louvre","attracts millions of visitors each year."],["Ada Lovelace, who wrote what many consider the first computer","program","worked with Charles Babbage on his Analytical Engine."],["The comet, last seen from Earth more than eighty years","ago","will be visible again next spring."],["The bridge, completed after nearly a decade of","construction","connects the island to the mainland."]];
function gNonEss(t){ const [a,w,b]=pick(F_NE);
  return secItem(a,b,w+",",[w,w+";",w+"—"],"Boundaries",`The extra information was opened with a comma, so it must close with a matching comma. Test it: cross out the middle part and the sentence still reads correctly.`,t); }
const F_SVA=[["The box of old photographs","currently stored in the attic.","s"],["The trees along the river","now covered in bright red leaves.","p"],["The list of finalists","now posted on the bulletin board.","s"],["The members of the debate team","currently preparing for the state tournament.","p"],["A flock of geese","now resting on the pond behind the school.","s"],["The paintings in the gallery's east wing","currently on loan from a museum in Madrid.","p"],["Each of the new laptops","now equipped with a faster processor.","s"],["The results of the survey","now available on the city's website.","p"]];
function gSVA(t){ const [a,b,n]=pick(F_SVA); const sg=n==="s";
  return secItem(a,b,sg?"is":"are",sg?["are","were","have been"]:["is","was","has been"],"Subject-verb agreement",
    `Ignore the phrase between the subject and the verb. The subject is ${sg?"singular":"plural"}, and "${/now|currently/.exec(b)[0]}" sets the present tense, so the verb is <b>${sg?"is":"are"}</b>.`,t); }
const F_PRON=[["The committee announced","decision after a two-hour meeting.","s"],["Each of the students submitted","project before the deadline.","s"],["The company redesigned","website to make it easier to use.","s"],["The Ramirez twins packed","own lunches for the field trip.","p"],["The city's two libraries extended","hours during exam week.","p"],["The orchestra tuned","instruments before the concert began.","s"],["The volunteers finished","work an hour ahead of schedule.","p"]];
function gPron(t){ const [a,b,n]=pick(F_PRON); const sg=n==="s";

const F_POSS=[["The","wing was injured, so she could not fly.","bird","sp"],["All three","uniforms were washed before the game.","team","pp"],["Several","visited the school to talk about careers in medicine.","doctor","pl"],["The two","bicycles were locked outside the library.","sister","pp"],["My","favorite toy is a squeaky rubber duck that he carries everywhere.","dog","sp"],["Many","attended the town meeting to discuss the new park.","resident","pl"]];
function gPoss(t){ const [a,b,w,f]=pick(F_POSS); const forms={sp:w+"'s",pl:w+"s",pp:w+"s'"};
  const why={sp:`One ${w}, and something belongs to it: singular possessive <b>${w}'s</b>.`,pp:`More than one ${w}, and something belongs to them: plural possessive <b>${w}s'</b>.`,pl:`More than one ${w}, but nothing belongs to them: plain plural <b>${w}s</b>, no apostrophe.`};
  return secItem(a,b,forms[f],[forms.sp,forms.pl,forms.pp,w+"s's"].filter(x=>x!==forms[f]),"Possessives",why[f],t); }
const F_TENSE=[["By the time the movie started, we","all of our popcorn.",["had eaten","eat","will eat","are eating"],"An action finished before another past action takes the past perfect"],["Last winter, the lake","completely for the first time in a decade.",["froze","freezes","will freeze","is freezing"],"\"Last winter\" sets the action in the past"],["Next summer, my cousin","an internship at a marine research center.",["will begin","began","had begun","has begun"],"\"Next summer\" sets the action in the future"],["In 1969, astronauts","on the Moon for the first time.",["landed","land","will land","are landing"],"\"In 1969\" sets the action in the past"],["When the fire alarm rang, the students","the building calmly and quickly.",["left","leave","will leave","are leaving"],"\"Rang\" is past tense, so the action that responds to it is too"],["Every morning, the baker","the ovens before sunrise, just as she has for twenty years.",["lights","lit","had lit","will have lit"],"\"Every morning\" and \"has for twenty years\" describe an ongoing habit in the present"]];
function gTense(t){ const [a,b,f,why]=pick(F_TENSE);
  return secItem(a,b,f[0],f.slice(1),"Verb tense",`${why}: <b>${f[0]}</b>.`,t); }

/* ---------- Words in context bank ---------- */
const WICQ="Which choice completes the text with the most logical and precise word or phrase?";
const WIC_BANK={
 "1":[["The candidate's speech was deliberately ______: it avoided specific promises so that voters with very different priorities could each hear what they wanted.","vague","candid","technical","hostile","Avoiding specific promises so everyone hears what they want describes a <b>vague</b> speech."],
  ["Because the original manuscript had been damaged by water, scholars could only ______ the missing lines using earlier printed editions.","reconstruct","dismiss","publish","ignore","Using other editions to fill in lost lines is to <b>reconstruct</b> them."],
  ["The team's victory was ______: they had trailed for most of the game before scoring twice in the final minute.","improbable","routine","inevitable","unanimous","Coming back from behind in the last minute makes the win unlikely, or <b>improbable</b>."],
  ["Participation in the new program was ______ at first, with only a few employees signing up, but it grew steadily over the next year.","limited","widespread","mandatory","permanent","\"Only a few employees\" means participation was <b>limited</b>."],
  ["The biologist's field notes are remarkably ______, recording the time, temperature, and location of every single observation.","thorough","brief","careless","speculative","Recording every detail of every observation is <b>thorough</b>."],
  ["Ancient Roman concrete has proven surprisingly ______; some harbor walls built with it have withstood two thousand years of ocean waves.","durable","fragile","decorative","costly","Surviving two thousand years of waves means it lasts: <b>durable</b>."],
  ["The author ______ her argument with data from more than forty studies, making it difficult for critics to dismiss.","bolstered","abandoned","concealed","delayed","Adding data from forty studies strengthens, or <b>bolsters</b>, an argument."],
  ["Rather than ______ the disagreement, the mediator encouraged both sides to state their concerns openly.","suppress","clarify","explore","record","\"Rather than\" signals the opposite of encouraging open discussion: <b>suppress</b>. Clarifying or exploring would fit with what the mediator did, not contrast with it."]],
 "E":[["The puppy was so ______ that it ran circles around the yard for an hour without stopping.","energetic","sleepy","timid","quiet","Running for an hour without stopping shows the puppy is <b>energetic</b>."],
  ["The instructions were ______, so everyone was able to put the bookshelf together without any problems.","clear","confusing","missing","lengthy","Instructions that let everyone succeed easily are <b>clear</b>."],
  ["Maya was ______ to learn that she had won the poetry contest, since she had not expected to place at all.","thrilled","disappointed","bored","annoyed","An unexpected win would make her <b>thrilled</b>."],
  ["The town's population ______ after the factory opened, as many new workers moved there with their families.","grew","shrank","vanished","stalled","New workers moving in means the population <b>grew</b>."],
  ["The museum's ______ collection includes art from more than fifty countries.","diverse","tiny","identical","local","Art from fifty countries is varied, or <b>diverse</b>."],
  ["Because the soup was too hot to eat, Leo waited for it to ______.","cool","boil","spill","freeze","Waiting for hot soup to become eatable means waiting for it to <b>cool</b>."],
  ["The coach ______ the team's effort, telling the players she was proud of how hard they had worked.","praised","ignored","criticized","doubted","Saying she was proud means she <b>praised</b> them."],
  ["The desert receives very ______ rainfall, sometimes going a full year without any at all.","little","heavy","frequent","steady","A year without rain means very <b>little</b> rainfall."]],
 "H":[["The essayist's tone is ______: she describes the city council's repeated delays with exaggerated praise that makes the members' inaction seem all the more absurd.","ironic","earnest","clinical","nostalgic","Praising something to show how absurd it is says the opposite of what is meant: <b>ironic</b>."],
  ["Early reviewers found the composer's harmonies ______, but later listeners, used to more experimental music, heard them as natural and even inevitable.","jarring","soothing","derivative","conventional","\"But\" contrasts with \"natural,\" so early listeners must have found them harsh: <b>jarring</b>."],
  ["The committee's final report ______ the earlier findings rather than overturning them, adding new data that confirmed and extended the original conclusions.","corroborated","refuted","ignored","misrepresented","Confirming earlier findings with new data is to <b>corroborate</b> them."],
  ["The archaeologist cautioned that the evidence for the settlement's age was ______: a single charred seed, from a soil layer that may have been disturbed.","tenuous","conclusive","abundant","contemporary","One seed from a possibly disturbed layer is weak evidence: <b>tenuous</b>."],
  ["Despite the scientist's ______ claims in interviews, her published papers are carefully qualified, noting every limitation of her data.","sweeping","modest","technical","accurate","\"Despite\" contrasts with \"carefully qualified,\" so the interview claims were broad and bold: <b>sweeping</b>."],
  ["The novel's narrator is notably ______, often withholding key details and occasionally contradicting her own earlier accounts.","unreliable","omniscient","sentimental","impartial","A narrator who withholds and contradicts can't be trusted: <b>unreliable</b>."],
  ["The startup's growth was ______: after years of slow progress, its user base multiplied tenfold in a single quarter.","meteoric","incremental","stagnant","predictable","Multiplying tenfold in one quarter is extremely fast growth: <b>meteoric</b>."],
  ["Some economists dismissed the rise in prices as ______, expecting it to fade within months, but it persisted for nearly three years.","transitory","structural","permanent","deliberate","\"Expecting it to fade within months\" defines the blank: short-lived, or <b>transitory</b>."]]};
function mkWIC(e,t){ const [s,c,d1,d2,d3,x]=e;
  return mk({p:`<p>${s}</p>`,q:WICQ,...mcText(c,[d1,d2,d3]),x},"rw","Craft & Structure","Words in context",t); }

/* ---------- Transitions bank ---------- */
const TRW={contrast:"However,",cause:"As a result,",example:"For example,",addition:"In addition,",sequence:"Next,",similar:"Similarly,",alternative:"Instead,"};
const TREX={contrast:["alternative"],cause:["sequence"],example:["addition"],addition:["example","similar","sequence"],sequence:["addition","cause"],similar:["addition"],alternative:["contrast","cause"]};
const TRX={contrast:"The second sentence goes against what the first leads you to expect, so the text needs a contrast",cause:"The second sentence is a result of the first",example:"The second sentence gives a specific example of the general statement before it",addition:"The second sentence adds another point of the same kind",sequence:"These are steps in order, so the transition should mark the next step",similar:"The second sentence describes something parallel to the first",alternative:"The second sentence describes what was done in place of the option the first sentence rejects"};
const TR_BANK={
 "E":[["Ana studied every night for the history test.","she earned one of the highest scores in her class.","cause"],["Most birds can fly.","ostriches and emus cannot.","contrast"],["Many fruits are high in vitamin C.","oranges and strawberries are both excellent sources.","example"],["First, preheat the oven to 350 degrees.","mix the flour and sugar in a large bowl.","sequence"],["Riding a bike is good exercise.","it produces no air pollution.","addition"],["The roads were covered in ice.","school was canceled for the day.","cause"],["Ming wanted to play soccer outside.","it was raining too hard.","contrast"],["Some animals sleep through the winter.","bears can rest in their dens for months.","example"],["Lena forgot her umbrella at home.","she got soaked walking to the bus stop.","cause"],["The movie was nearly three hours long.","it was so exciting that the time flew by.","contrast"]],
 "1":[["Earthworms improve soil by breaking down dead plant material.","their tunnels let air and water reach plant roots.","addition"],["The bridge's design was praised for its elegance.","engineers soon discovered that it swayed dangerously in strong winds.","contrast"],["Several ancient cultures tracked the movements of the stars.","Babylonian astronomers recorded the positions of planets on clay tablets.","example"],["The factory switched to renewable energy sources.","its carbon emissions dropped by nearly 60 percent.","cause"],["The company's first product sold poorly.","its second product became a bestseller.","contrast"],["Large volcanic eruptions can cool the planet temporarily.","the 1991 eruption of Mount Pinatubo lowered average global temperatures for about two years.","example"],["Frogs absorb water and oxygen through their thin skin.","they are especially sensitive to pollutants in their environment.","cause"],["Bees pollinate many of the crops people eat.","butterflies, moths, and some bats also carry pollen between plants.","addition"],["Rewrite the rough draft so that each paragraph has a clear main idea.","check every sentence for spelling and punctuation errors.","sequence"],["Most metals are solid at room temperature.","mercury is a liquid at room temperature.","contrast"]],
 "H":[["The senator voted against the bill in committee.","she later supported a revised version that included her amendments.","contrast"],["The study's sample was small and drawn from a single city.","its conclusions should be applied to other populations with caution.","cause"],["Early cameras required very long exposures.","an 1838 photograph of a busy Paris street shows only one visible person, a man who stood still while having his boots polished.","example"],["The painter rejected the bright colors popular among her peers.","she worked almost entirely in shades of gray and brown.","alternative"],["Urban foxes have adapted to city life in remarkable ways.","some have learned to time their foraging to neighborhood trash collection schedules.","example"],["Critics predicted that the tuition reform would reduce enrollment.","enrollment rose by 12 percent in the year after it took effect.","contrast"],["The orchestra lost its largest funding source in 2019.","it cut its season from twelve concerts to five.","cause"],["Rather than relying on a single crop, the farmers planted a mix of drought-tolerant grains.","they built small ponds to store rainwater for the dry season.","addition"],["The first trial of the new material failed under heavy loads.","the engineers did not abandon it.","contrast"]]};
function mkTR(e,t){ const [s1,s2,cat]=e; const others=shuffle(Object.keys(TRW).filter(c=>c!==cat && !TREX[cat].includes(c))).slice(0,3);
  return mk({p:`<p>${s1} ______ ${s2}</p>`,q:"Which choice completes the text with the most logical transition?",...mcText(TRW[cat],others.map(c=>TRW[c])),
    x:`${TRX[cat]}: <b>${TRW[cat].replace(",","")}</b>.`},"rw","Expression of Ideas","Transitions",t); }

/* ---------- Quantitative evidence generator ---------- */
const QCTX=[["number of students in the robotics club","",["Lincoln High","Oakridge High","Riverside High"],"schools"],["number of bird species counted","",["Site A","Site B","Site C"],"wetland sites"],["percentage of residents with a library card","%",["Portview","Millbrook","Dalton"],"towns"],["number of annual visitors, in thousands","",["Cedar Falls","Pine Ridge","Blue Lake"],"state parks"]];
function gQuant(t){
  const [what,u,G,grp]=pick(QCTX), f=v=>v+u, fc=v=>u==="%"? v+" percentage points" : String(v);
  const v1=G.map(()=>ri(15,60)), g=ri(0,2), o=[0,1,2].filter(i=>i!==g); let v2,claim,corr,ds;
  const type = t==="E" ? "A" : pick(["A","B"]);
  if(type==="A"){ v2=v1.map((v,i)=> i===g? v+ri(3,14) : v-ri(2,9));
    claim=`only ${G[g]} saw an increase from 2019 to 2024`;
    corr=`${G[g]} rose from ${f(v1[g])} to ${f(v2[g])}, while ${G[o[0]]} fell from ${f(v1[o[0]])} to ${f(v2[o[0]])} and ${G[o[1]]} fell from ${f(v1[o[1]])} to ${f(v2[o[1]])}.`;
    ds=[`${G[g]} rose from ${f(v1[g])} in 2019 to ${f(v2[g])} in 2024.`,`${G[o[0]]} fell from ${f(v1[o[0]])} in 2019 to ${f(v2[o[0]])} in 2024.`,`In 2019, each of the three ${grp} had a value of at least ${f(Math.min(...v1))}.`];
  } else { const inc=[ri(2,8),ri(2,8),ri(2,8)]; inc[g]=Math.max(...inc)+ri(2,6); v2=v1.map((v,i)=>v+inc[i]);
    claim=`${G[g]} had the largest increase of the three ${grp} from 2019 to 2024`;
    corr=`${G[g]} increased by ${fc(inc[g])}, compared with ${fc(inc[o[0]])} for ${G[o[0]]} and ${fc(inc[o[1]])} for ${G[o[1]]}.`;
    ds=[`${G[g]} rose from ${f(v1[g])} in 2019 to ${f(v2[g])} in 2024.`,`All three ${grp} had higher values in 2024 than in 2019.`,`${G[o[0]]} rose from ${f(v1[o[0]])} in 2019 to ${f(v2[o[0]])} in 2024.`]; }
  const table=`<div class="scroll"><table><tr><th>${cap(grp.replace(/s$/,""))}</th><th>2019</th><th>2024</th></tr>${G.map((n,i)=>`<tr><td>${n}</td><td>${f(v1[i])}</td><td>${f(v2[i])}</td></tr>`).join("")}</table></div>`;
  return mk({p:`<p>A student compiled data on the ${what} at three ${grp}.</p>${table}<p>The student claims that ${claim}.</p>`,
    q:`Which choice most effectively uses data from the table to support the student's claim?`,...mcText(corr,ds),
    x: type==="A" ? `"Only" needs two parts: ${G[g]} went up <i>and</i> the other two did not. One choice shows both; the others are true but incomplete.` : `"Largest increase" requires comparing the change for all three. One choice gives all three increases; the others are true but make no comparison.`},
    "rw","Information & Ideas","Command of evidence (quantitative)",t);
}

/* ---------- Test assembly ---------- */
const GEN = {
  "Algebra":[gLinEq,gLinModel,gSlope,gSystem,gIneq],
  "Advanced Math":[gQuad,gExpand,gFunc,gExpo,gPow,gVertex],
  "Problem-Solving & Data Analysis":[gPct,gMean,gRatio,gProb,gSample],
  "Geometry & Trigonometry":[gPyth,gCircle,gAngle,gArea],
  "Standard English Conventions":[gSemi,gColon,gNonEss,gSVA,gPron,gPoss,gTense]
};
const MATHN={"Algebra":8,"Advanced Math":7,"Problem-Solving & Data Analysis":4,"Geometry & Trigonometry":3};
function register(q){ byId[q.id]=q; return q; }
function genFrom(list,n,tier){ const fs=shuffle(list), out=[]; for(let i=0;i<n;i++) out.push(register(fs[i%fs.length](tier))); return out; }
function authored(s,tier,f){ return shuffle(QS.filter(q=>q.s===s && q.mod===tier && f(q))); }
function buildModule(s,tier){
  let qs=[];
  if(s==="m"){
    const txt=new Set();
    const per=DOMS.m.map(d=>{ const n=MATHN[d]; const a=authored("m",tier,q=>q.d===d).slice(0,Math.floor(n/2)); a.forEach(q=>txt.add(q.q));
      const fs=shuffle(GEN[d]), g=[]; for(let i=0;g.length<n-a.length;i++){ let q, tries=0; do{ q=fs[i%fs.length](tier); }while(txt.has(q.q) && ++tries<12); txt.add(q.q); g.push(register(q)); }
      return shuffle(a.concat(g)); });
    while(per.some(x=>x.length)) per.forEach(x=>{ if(x.length) qs.push(x.shift()); });
  } else {
    const wic = shuffle(authored("rw",tier,q=>q.k==="Words in context").concat(WIC_BANK[tier].map(e=>({_w:e})))).slice(0,4).map(x=>x._w? register(mkWIC(x._w,tier)) : x);
    const cs = authored("rw",tier,q=>q.d==="Craft & Structure" && q.k!=="Words in context").slice(0,3);
    const ii = authored("rw",tier,q=>q.d==="Information & Ideas" && !/quantitative/.test(q.k)).slice(0,6).concat([register(gQuant(tier))]);
    const sec = authored("rw",tier,q=>q.d===SE).slice(0,3).concat(genFrom(GEN[SE],4,tier));
    const tr = shuffle(authored("rw",tier,q=>q.k==="Transitions").concat(TR_BANK[tier].map(e=>({_t:e})))).slice(0,4).map(x=>x._t? register(mkTR(x._t,tier)) : x);
    const syn = authored("rw",tier,q=>q.k==="Rhetorical synthesis").slice(0,2);
    const order=["Words in context","Text structure and purpose","Cross-text connections"];
    qs = [...wic, ...cs.sort((a,b)=>order.indexOf(a.k)-order.indexOf(b.k)), ...ii, ...shuffle(sec), ...tr, ...syn];
  }
  return qs.map(q=>q.id);
}
function drillPool(d){
  const tiers=["1","E","H"]; const pool=QS.filter(q=>q.d===d);
  if(GEN[d]) for(let i=0;i<10;i++) pool.push(register(pick(GEN[d])(pick(tiers))));
  if(d==="Craft & Structure") for(let i=0;i<5;i++){ const t=pick(tiers); pool.push(register(mkWIC(pick(WIC_BANK[t]),t))); }
  if(d==="Expression of Ideas") for(let i=0;i<6;i++){ const t=pick(tiers); pool.push(register(mkTR(pick(TR_BANK[t]),t))); }
  if(d==="Information & Ideas") for(let i=0;i<3;i++) pool.push(register(gQuant(pick(tiers))));
  const seen=new Set();
  return shuffle(pool).filter(q=>{ const key=(q.p||"")+q.q; if(seen.has(key)) return false; seen.add(key); return true; }).map(q=>q.id);
}
render();

</script>
