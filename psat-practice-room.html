<footer>Built by Elevate L&amp;D Consulting. All questions are original practice items written in the style of the digital PSAT/NMSQT; not affiliated with or endorsed by College Board. Progress is saved in this browser only.</footer>

<script>
const WIC = `Which choice completes the text with the most logical and precise word or phrase?`;
const SEC = `Which choice completes the text so that it conforms to the conventions of Standard English?`;
const TR = `Which choice completes the text with the most logical transition?`;
const QS = [
/* ---------- Reading & Writing ---------- */
{id:"rw1",s:"rw",d:"Craft & Structure",k:"Words in context",
 p:`<p>When the botanist first published her predictions about how drought would shift wildflower blooming times, many colleagues called them premature. Her predictions proved remarkably ______: trials conducted a decade later, using far larger samples, confirmed nearly all of them.</p>`,
 q:`Which choice completes the text with the most logical and precise word?`,
 c:["provisional","prescient","contentious","derivative"],a:1,
 x:`The colon introduces proof: later trials confirmed the predictions. A prediction that turns out correct long before others can verify it is <b>prescient</b> (seeing ahead). "Contentious" describes the early reaction, not how the predictions proved.`},
{id:"rw2",s:"rw",d:"Craft & Structure",k:"Words in context",
 p:`<p>Although the transit committee's full report ran to more than three hundred pages, its recommendations were ______, fitting on a single page that any council member could read in a few minutes.</p>`,
 q:`Which choice completes the text with the most logical and precise word?`,
 c:["concise","exhaustive","speculative","obscure"],a:0,
 x:`"Although" sets up a contrast with the long report, and the rest of the sentence describes something short and readable. <b>Concise</b> fits. "Exhaustive" means the opposite.`},
{id:"rw3",s:"rw",d:"Craft & Structure",k:"Text structure and purpose",
 p:`<p>Many people assume that city pigeons are a nuisance species with no history worth studying. Yet pigeons were among the first birds humans domesticated, valued for thousands of years as messengers and as a source of food. Their presence in cities today is a direct legacy of that partnership: escaped and abandoned domestic birds formed the urban flocks we see now.</p>`,
 q:`Which choice best describes the overall structure of the text?`,
 c:["It presents a common assumption, then offers historical information that complicates it.","It describes an experiment, then explains the experiment's limitations.","It compares two bird species, then recommends one over the other.","It argues that pigeons should be removed from cities, then lists reasons."],a:0,
 x:`Sentence 1 states what "many people assume." "Yet" pivots to history that challenges that view. That is a claim-then-complication structure. There is no experiment, comparison of species, or argument for removal.`},
{id:"rw4",s:"rw",d:"Craft & Structure",k:"Cross-text connections",
 p:`<p><b>Text 1</b><br>Some economists argue that a four-day workweek will inevitably reduce productivity. Their reasoning is simple: when employees work fewer hours, they produce less.</p><p><b>Text 2</b><br>In trials across several countries, companies that moved to a four-day week generally maintained or even increased their output. Employees reported fewer distractions and less burnout, which researchers believe helped them accomplish more in less time.</p>`,
 q:`Based on the texts, how would the researchers in Text 2 most likely respond to the reasoning of the economists in Text 1?`,
 c:["By agreeing that total hours worked is the main factor determining output","By arguing that trial evidence does not support the assumption that fewer hours means less output","By claiming that employee burnout has no effect on productivity","By suggesting that four-day workweeks should be tested only in a single country"],a:1,
 x:`Text 1 assumes fewer hours = less output. Text 2's trials found output stayed the same or rose. So Text 2 would say the evidence contradicts that assumption. The burnout choice contradicts Text 2 itself, which links reduced burnout to productivity.`},
{id:"rw5",s:"rw",d:"Information & Ideas",k:"Central ideas",
 p:`<p>An octopus has roughly 500 million neurons, but about two-thirds of them are located in its arms rather than its central brain. Researchers have observed that an octopus arm can continue to reach toward and grasp food even when its connection to the brain has been interrupted. Findings like these suggest that each arm can process information and act with some independence from the brain.</p>`,
 q:`Which choice best states the main idea of the text?`,
 c:["Octopuses have more neurons than any other invertebrate.","Octopus arms appear able to process information and act partly on their own.","Researchers do not yet know where most octopus neurons are located.","An octopus cannot find food without using its central brain."],a:1,
 x:`Every detail (neuron location, arms grasping food, the final "suggest" sentence) builds to one point: the arms work with some independence. A is never stated, C is contradicted, D is the opposite of the evidence.`},
{id:"rw6",s:"rw",d:"Information & Ideas",k:"Inferences",
 p:`<p>Researchers studying a river system noticed that, within three years after an old dam was removed, populations of a particular fish species upstream of the former dam site increased sharply. Because this species is known to migrate upstream each year to spawn in shallow gravel beds, the researchers concluded that ______</p>`,
 q:`Which choice most logically completes the text?`,
 c:["the dam had likely prevented the fish from reaching their spawning grounds.","the water temperature in the river had dropped after the dam's removal.","the fish's main predator had also become more common upstream.","the fish no longer need to travel upstream in order to spawn."],a:0,
 x:`Two facts connect: the fish must travel upstream to spawn, and their numbers rose once the barrier was gone. The logical conclusion is that the dam had been blocking them. The other choices introduce information the text never mentions.`},
{id:"rw7",s:"rw",d:"Information & Ideas",k:"Command of evidence (textual)",
 p:`<p>A historian claims that a 19th-century novelist relied heavily on her family's personal letters when writing her historical novels.</p>`,
 q:`Which finding, if true, would most directly support the historian's claim?`,
 c:["Several scenes in the novels repeat, nearly word for word, passages from letters kept in the novelist's family archive.","The novelist's books were widely read during her lifetime.","The novelist once wrote that she disliked writing letters herself.","Critics praised the realistic dialogue in the novels."],a:0,
 x:`The claim is specifically about using family letters. Only A ties the novels directly to those letters. Realistic dialogue could have many causes, so it supports the claim only loosely.`},
{id:"rw8",s:"rw",d:"Information & Ideas",k:"Command of evidence (quantitative)",
 p:`<p>A student tracked vegetable yields at a community garden that uses two growing methods.</p>
 <div class="scroll"><table><tr><th>Method</th><th>Year 1 yield (kg)</th><th>Year 2 yield (kg)</th></tr><tr><td>Traditional plots</td><td>120</td><td>115</td></tr><tr><td>Raised beds</td><td>150</td><td>175</td></tr></table></div>
 <p>The student argues that the advantage of raised beds over traditional plots grew from Year 1 to Year 2.</p>`,
 q:`Which choice most effectively uses data from the table to support the student's argument?`,
 c:["Raised beds produced 30 kg more than traditional plots in Year 1 and 60 kg more in Year 2.","Traditional plots produced 120 kg in Year 1.","Raised beds produced 150 kg in Year 1 and 175 kg in Year 2.","Both methods produced more than 100 kg in each year."],a:0,
 x:`The claim is about the <i>gap</i> between methods growing. You need both methods in both years: 150−120 = 30, then 175−115 = 60. Listing only the raised-bed yields shows one method, so it can't show a gap.`},
{id:"rw9",s:"rw",d:"Information & Ideas",k:"Inferences",
 p:`<p>In her memoir, a retired engineer describes keeping every failed prototype she ever built on a shelf in her office. Visitors often asked why she displayed her mistakes. She explained that each one reminded her of an idea she no longer had to test.</p>`,
 q:`Based on the text, how does the engineer most likely view her failed prototypes?`,
 c:["As useful records that narrowed the possibilities she still needed to explore","As embarrassing reminders she kept only because visitors expected them","As decorations with little connection to her work","As proof that engineers should avoid taking risks"],a:0,
 x:`"An idea she no longer had to test" means each failure ruled something out. That makes them useful records. Nothing suggests embarrassment or avoiding risk.`},
{id:"rw10",s:"rw",d:"Craft & Structure",k:"Words in context",
 p:`<p>Critics initially dismissed the sculptor's use of discarded materials as a gimmick. Her persistence over two decades, however, eventually ______ a broader shift in how major galleries valued recycled art.</p>`,
 q:`Which choice completes the text with the most logical and precise word?`,
 c:["catalyzed","hindered","imitated","concealed"],a:0,
 x:`"However" signals her persistence succeeded despite critics. Something that sparks or speeds up change <b>catalyzed</b> it. "Hindered" would mean she blocked the shift.`},
{id:"rw11",s:"rw",d:"Standard English Conventions",k:"Boundaries",
 p:`<p>The museum's newest exhibit features more than two hundred ______ many of them have never been displayed publicly before.</p>`,
 q:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
 c:["artifacts,","artifacts;","artifacts","artifacts, which"],a:1,
 x:`Both halves are complete sentences. Two independent clauses can be joined by a semicolon (or a period). A comma alone is a comma splice, nothing at all is a run-on, and "which many of them" is ungrammatical.`},
{id:"rw12",s:"rw",d:"Standard English Conventions",k:"Subject-verb agreement",
 p:`<p>The collection of rare maps, donated by a retired ship captain, ______ now on display in the library's east wing.</p>`,
 q:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
 c:["is","are","were","have been"],a:0,
 x:`Cross out the extras: "The collection ... ______ now on display." The subject is <i>collection</i> (singular), not <i>maps</i>. Singular + present tense ("now") = <b>is</b>.`},
{id:"rw13",s:"rw",d:"Standard English Conventions",k:"Pronouns",
 p:`<p>Each of the robotics teams presented ______ final design to the panel of judges.</p>`,
 q:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
 c:["its","their","it's","they're"],a:0,
 x:`The subject is <i>each</i>, which is singular, so the possessive pronoun must be singular: <b>its</b>. "It's" means "it is." The test treats "each" as singular every time.`},
{id:"rw14",s:"rw",d:"Standard English Conventions",k:"Verb tense",
 p:`<p>By the time the rescue crew reached the ridge, the stranded hikers ______ shelter in a small cave.</p>`,
 q:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
 c:["had found","find","will find","are finding"],a:0,
 x:`"By the time ... reached" is a past event, and finding shelter happened even earlier. An action completed before another past action takes the past perfect: <b>had found</b>.`},
{id:"rw15",s:"rw",d:"Standard English Conventions",k:"Boundaries",
 p:`<p>The traditional flatbread recipe calls for only three ______ flour, water, and salt.</p>`,
 q:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
 c:["ingredients:","ingredients,","ingredients;","ingredients"],a:0,
 x:`A colon introduces a list after a complete sentence ("The ... recipe calls for only three ingredients"). A semicolon needs a full sentence after it, and "flour, water, and salt" isn't one.`},
{id:"rw16",s:"rw",d:"Standard English Conventions",k:"Modifiers",
 p:`<p>Hoping to finish before the storm arrived, ______</p>`,
 q:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
 c:["the roofers worked straight through their lunch break.","the lunch break was skipped by the roofers.","the storm forced the roofers to skip lunch.","skipping lunch was the roofers' choice."],a:0,
 x:`Whoever is "hoping" must come right after the comma. Only people can hope, so the roofers must be the subject. The other choices make the lunch break, the storm, or "skipping" do the hoping.`},
{id:"rw17",s:"rw",d:"Standard English Conventions",k:"Possessives",
 p:`<p>The three ______ research focused on how coral reefs recover after periods of extreme ocean heat.</p>`,
 q:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
 c:["scientists'","scientist's","scientists","scientists's"],a:0,
 x:`There are three scientists (plural), and the research belongs to them (possessive). Plural ending in s → add only an apostrophe: <b>scientists'</b>.`},
{id:"rw18",s:"rw",d:"Expression of Ideas",k:"Transitions",
 p:`<p>The price of solar panels has fallen steadily for more than a decade. ______ many homeowners still hesitate to install them, citing high upfront installation costs.</p>`,
 q:`Which choice completes the text with the most logical transition?`,
 c:["However,","Therefore,","Similarly,","For example,"],a:0,
 x:`Cheaper panels would lead you to expect more installations, but people still hesitate. That's a contrast, so <b>However</b>. "Therefore" would mean falling prices <i>cause</i> hesitation.`},
{id:"rw19",s:"rw",d:"Expression of Ideas",k:"Transitions",
 p:`<p>Honeybees share the location of food with their hive through a movement called the waggle dance. ______ the angle of the dance tells other bees the direction of the food relative to the sun.</p>`,
 q:`Which choice completes the text with the most logical transition?`,
 c:["Specifically,","Nevertheless,","In contrast,","Consequently,"],a:0,
 x:`The second sentence gives a precise detail about <i>how</i> the dance shares location. Moving from general to specific calls for <b>Specifically</b>. Nothing is being contrasted or caused.`},
{id:"rw20",s:"rw",d:"Expression of Ideas",k:"Rhetorical synthesis",
 p:`<p>While researching a topic, a student has taken the following notes:</p><ul><li>The Mariana Trench is the deepest known part of Earth's oceans.</li><li>Its deepest point, Challenger Deep, is about 10,935 meters below sea level.</li><li>Mount Everest, the tallest mountain above sea level, is about 8,849 meters tall.</li></ul>`,
 q:`The student wants to emphasize how deep Challenger Deep is by using a comparison. Which choice most effectively uses relevant information from the notes to accomplish this goal?`,
 c:["At about 10,935 meters deep, Challenger Deep could hold Mount Everest (about 8,849 meters tall) with more than 2,000 meters to spare.","The Mariana Trench is the deepest known part of Earth's oceans.","Mount Everest is about 8,849 meters tall.","Challenger Deep is the deepest point in the Mariana Trench."],a:0,
 x:`The goal names two requirements: show depth <i>and</i> use a comparison. Only A compares Challenger Deep to Everest. On synthesis questions, read the goal first and pick the choice that does exactly that.`},

/* ---------- Math ---------- */
{id:"m1",s:"m",d:"Algebra",k:"Linear equations",
 q:`If 3<i>x</i> + 7 = 25, what is the value of 6<i>x</i> − 4?`,c:["14","32","36","50"],a:1,
 x:`3<i>x</i> = 18, so 6<i>x</i> = 36 and 36 − 4 = 32. Shortcut: you never needed <i>x</i>. Double 3<i>x</i> directly. Choice C is the trap (stopping at 6<i>x</i>).`},
{id:"m2",s:"m",d:"Algebra",k:"Linear models",
 q:`A gym charges a one-time sign-up fee of $35 plus $22 per month. Which equation gives the total cost <i>C</i>, in dollars, of a membership for <i>m</i> months?`,
 c:["<i>C</i> = 35<i>m</i> + 22","<i>C</i> = 22<i>m</i> + 35","<i>C</i> = 57<i>m</i>","<i>C</i> = 22(<i>m</i> + 35)"],a:1,
 x:`The per-month cost multiplies <i>m</i>; the one-time fee is added once. So 22<i>m</i> + 35. Test it: 1 month should cost $57, and B gives 22 + 35 = 57.`},
{id:"m3",s:"m",d:"Algebra",k:"Slope",t:"gi",ans:[2],
 q:`A line in the <i>xy</i>-plane passes through the points (2, 5) and (6, 13). What is the slope of the line?`,
 x:`Slope = (13 − 5) ÷ (6 − 2) = 8 ÷ 4 = <b>2</b>.`},
{id:"m4",s:"m",d:"Algebra",k:"Systems of equations",
 q:`<i>x</i> + <i>y</i> = 10<br><i>x</i> − <i>y</i> = 4<br>What is the value of <i>x</i> in the solution to the system above?`,c:["3","6","7","14"],a:2,
 x:`Add the equations: 2<i>x</i> = 14, so <i>x</i> = 7. (Then <i>y</i> = 3, which is the trap in choice A.) In Desmos, graph both lines and tap the intersection.`},
{id:"m5",s:"m",d:"Algebra",k:"Linear inequalities",t:"gi",ans:[44],
 q:`A delivery van can safely carry at most 1,200 kilograms. The driver weighs 80 kilograms, and each box weighs 25 kilograms. What is the maximum number of boxes the van can carry with the driver?`,
 x:`80 + 25<i>b</i> ≤ 1,200 → 25<i>b</i> ≤ 1,120 → <i>b</i> ≤ 44.8. Boxes come in whole numbers and you can't go over, so round <b>down</b> to 44.`},
{id:"m6",s:"m",d:"Advanced Math",k:"Quadratics",t:"gi",ans:[5],
 q:`What is the sum of the solutions to the equation <i>x</i><sup>2</sup> − 5<i>x</i> + 6 = 0?`,
 x:`Factor: (<i>x</i> − 2)(<i>x</i> − 3) = 0, so <i>x</i> = 2 or 3, sum = <b>5</b>. Shortcut: for <i>ax</i><sup>2</sup> + <i>bx</i> + <i>c</i>, the sum of solutions is −<i>b</i>/<i>a</i> = 5.`},
{id:"m7",s:"m",d:"Advanced Math",k:"Equivalent expressions",
 q:`Which expression is equivalent to (<i>x</i> + 4)<sup>2</sup>?`,
 c:["<i>x</i><sup>2</sup> + 16","<i>x</i><sup>2</sup> + 8<i>x</i> + 16","<i>x</i><sup>2</sup> + 4<i>x</i> + 16","2<i>x</i> + 8"],a:1,
 x:`(<i>x</i> + 4)(<i>x</i> + 4) = <i>x</i><sup>2</sup> + 4<i>x</i> + 4<i>x</i> + 16 = <i>x</i><sup>2</sup> + 8<i>x</i> + 16. Choice A is the classic trap: you can't square each term separately.`},
{id:"m8",s:"m",d:"Advanced Math",k:"Exponential functions",
 q:`A lab culture starts with 500 bacteria, and the population doubles every 3 hours. Which function gives the population <i>P</i> after <i>t</i> hours?`,
 c:["<i>P</i>(<i>t</i>) = 500(2)<sup>3<i>t</i></sup>","<i>P</i>(<i>t</i>) = 500(2)<sup><i>t</i>/3</sup>","<i>P</i>(<i>t</i>) = 500 + 2<i>t</i>/3","<i>P</i>(<i>t</i>) = 500(3)<sup><i>t</i>/2</sup>"],a:1,
 x:`Doubling means base 2. The number of doublings after <i>t</i> hours is <i>t</i>/3. Check: at <i>t</i> = 3, B gives 500 · 2 = 1,000. Plugging in a value is the fastest way to test choices.`},
{id:"m9",s:"m",d:"Advanced Math",k:"Function notation",
 q:`The function <i>f</i> is defined by <i>f</i>(<i>x</i>) = 2<i>x</i><sup>2</sup> − 3. What is the value of <i>f</i>(−2)?`,c:["−11","−5","5","11"],a:2,
 x:`(−2)<sup>2</sup> = 4, so 2(4) − 3 = <b>5</b>. Trap: squaring −2 to get −4 leads to −11.`},
{id:"m10",s:"m",d:"Advanced Math",k:"Radical equations",t:"gi",ans:[4],
 q:`What is the solution to the equation √(<i>x</i> + 5) = <i>x</i> − 1?`,
 x:`Square both sides: <i>x</i> + 5 = <i>x</i><sup>2</sup> − 2<i>x</i> + 1 → <i>x</i><sup>2</sup> − 3<i>x</i> − 4 = 0 → (<i>x</i> − 4)(<i>x</i> + 1) = 0. Check both: <i>x</i> = −1 gives √4 = −2, which is false. Only <b>4</b> works. Always check radical answers.`},
{id:"m11",s:"m",d:"Advanced Math",k:"Vertex form",
 q:`What is the minimum value of <i>y</i> = 2(<i>x</i> − 3)<sup>2</sup> + 7?`,c:["−3","2","3","7"],a:3,
 x:`In vertex form <i>a</i>(<i>x</i> − <i>h</i>)<sup>2</sup> + <i>k</i>, the vertex is (<i>h</i>, <i>k</i>) = (3, 7). Since <i>a</i> = 2 is positive, the parabola opens up, so the minimum <i>y</i>-value is <b>7</b>. Choice C gives the <i>x</i>-value of the vertex.`},
{id:"m12",s:"m",d:"Problem-Solving & Data Analysis",k:"Percentages",
 q:`A jacket originally priced at $40 is marked down 25%. At checkout, an additional 10% is taken off the sale price. What is the final price?`,c:["$26","$27","$28","$30"],a:1,
 x:`$40 × 0.75 = $30, then $30 × 0.90 = <b>$27</b>. Stacked discounts are not added (25% + 10% ≠ 35% off, which would give $26).`},
{id:"m13",s:"m",d:"Problem-Solving & Data Analysis",k:"Mean and median",
 q:`A data set consists of the values 4, 7, 7, 9, and 13. If the value 13 is replaced with 33, which statement is true?`,
 c:["The median increases, and the mean stays the same.","The mean increases, and the median stays the same.","Both the mean and the median increase.","Neither the mean nor the median changes."],a:1,
 x:`The middle value is still 7, so the median doesn't move. The sum rises by 20, so the mean rises (from 8 to 12). Changing an extreme value affects the mean, not the median.`},
{id:"m14",s:"m",d:"Problem-Solving & Data Analysis",k:"Sampling and inference",t:"gi",ans:[345],
 q:`A random sample of 200 students at a school of 1,500 students was surveyed. Of those sampled, 46 said they bike to school. Based on the survey, what is the best estimate of the number of students at the school who bike to school?`,
 x:`46 ÷ 200 = 0.23. Apply that rate to the whole school: 0.23 × 1,500 = <b>345</b>.`},
{id:"m15",s:"m",d:"Problem-Solving & Data Analysis",k:"Rates",
 q:`A car travels 150 miles in 2.5 hours. At the same average speed, how many miles will it travel in 4 hours?`,c:["200","240","260","300"],a:1,
 x:`150 ÷ 2.5 = 60 miles per hour. 60 × 4 = <b>240</b> miles.`},
{id:"m16",s:"m",d:"Problem-Solving & Data Analysis",k:"Probability (two-way tables)",t:"gi",ans:[0.4],
 q:`<div class="scroll"><table style="border-collapse:collapse;margin-bottom:10px;font-variant-numeric:tabular-nums"><tr><th style="border:1px solid var(--line);padding:6px 10px"></th><th style="border:1px solid var(--line);padding:6px 10px">In band</th><th style="border:1px solid var(--line);padding:6px 10px">Not in band</th></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Juniors</td><td style="border:1px solid var(--line);padding:6px 10px">12</td><td style="border:1px solid var(--line);padding:6px 10px">28</td></tr><tr><td style="border:1px solid var(--line);padding:6px 10px">Seniors</td><td style="border:1px solid var(--line);padding:6px 10px">18</td><td style="border:1px solid var(--line);padding:6px 10px">22</td></tr></table></div>If a student is chosen at random from those <b>in band</b>, what is the probability that the student is a junior? (Enter as a decimal or fraction.)`,
 x:`"From those in band" shrinks the group to 12 + 18 = 30 students. Juniors in band: 12. Probability = 12/30 = <b>2/5 = 0.4</b>. The trap is dividing by all 80 students.`},
{id:"m17",s:"m",d:"Geometry & Trigonometry",k:"Right triangles",
 q:`A right triangle has legs of length 9 and 12. What is the length of its hypotenuse?`,c:["13","15","17","21"],a:1,
 x:`9<sup>2</sup> + 12<sup>2</sup> = 81 + 144 = 225, and √225 = 15. Faster: it's a 3-4-5 triangle scaled by 3.`},
{id:"m18",s:"m",d:"Geometry & Trigonometry",k:"Circles",
 q:`A circle in the <i>xy</i>-plane has equation (<i>x</i> − 2)<sup>2</sup> + (<i>y</i> + 1)<sup>2</sup> = 49. What is the radius of the circle?`,c:["2","7","24.5","49"],a:1,
 x:`Standard form is (<i>x</i> − <i>h</i>)<sup>2</sup> + (<i>y</i> − <i>k</i>)<sup>2</sup> = <i>r</i><sup>2</sup>. So <i>r</i><sup>2</sup> = 49 and <i>r</i> = <b>7</b>. Choice D is the most common trap.`},
{id:"m19",s:"m",d:"Geometry & Trigonometry",k:"Angles",t:"gi",ans:[135],
 q:`Two angles are supplementary. The measure of one angle is 3 times the measure of the other. What is the measure, in degrees, of the larger angle?`,
 x:`Supplementary angles sum to 180°. <i>x</i> + 3<i>x</i> = 180 → <i>x</i> = 45, so the larger angle is 3 × 45 = <b>135</b>. Re-read what's asked: 45 is the trap.`},
{id:"m20",s:"m",d:"Geometry & Trigonometry",k:"Trigonometry",
 q:`In right triangle <i>ABC</i>, angle <i>C</i> is the right angle and sin <i>A</i> = 3/5. What is the value of cos <i>B</i>?`,c:["3/5","4/5","3/4","5/3"],a:0,
 x:`<i>A</i> and <i>B</i> are complementary, and the sine of an angle equals the cosine of its complement. So cos <i>B</i> = sin <i>A</i> = <b>3/5</b>. This shows up on nearly every test.`},
{id:"m21",s:"m",d:"Geometry & Trigonometry",k:"Volume",
 q:`A cylinder has a radius of 3 centimeters and a height of 4 centimeters. What is its volume, in cubic centimeters?`,c:["12π","24π","36π","48π"],a:2,
 x:`<i>V</i> = π<i>r</i><sup>2</sup><i>h</i> = π(9)(4) = <b>36π</b>. The formula is on the reference sheet in the test app, so you never need to memorize it.`},
{id:"m22",s:"m",d:"Geometry & Trigonometry",k:"Area and perimeter",t:"gi",ans:[192],
 q:`The length of a rectangle is 3 times its width. The perimeter of the rectangle is 64 units. What is the area of the rectangle, in square units?`,
 x:`Let width = <i>w</i>. 2(3<i>w</i> + <i>w</i>) = 64 → 8<i>w</i> = 64 → <i>w</i> = 8, length = 24. Area = 8 × 24 = <b>192</b>.`},
/* ===== R&W Module 1 additions ===== */
{id:"rw21",s:"rw",d:"Craft & Structure",k:"Words in context",mod:"1",
 p:`<p>The new library director has a reputation for being ______: she rarely makes a decision without first consulting staff, patrons, and community groups.</p>`,q:WIC,
 c:["deliberative","impulsive","reclusive","indifferent"],a:0,
 x:`The colon explains the blank: she consults many people before deciding. Someone who weighs input carefully before acting is <b>deliberative</b>.`},
{id:"rw22",s:"rw",d:"Craft & Structure",k:"Text structure and purpose",mod:"1",
 p:`<p>In 1928, Alexander Fleming noticed that a mold contaminating one of his bacterial cultures had killed the bacteria around it. Rather than throw away the ruined dish, he investigated the mold further. His curiosity led to the discovery of penicillin, the first widely used antibiotic.</p>`,
 q:`Which choice best states the main purpose of the text?`,
 c:["To show how an unexpected observation led to an important discovery","To argue that contamination is a common problem in laboratories","To compare penicillin with other antibiotics","To criticize Fleming's laboratory methods"],a:0,
 x:`The text moves from an accident (contamination) to Fleming's choice to investigate to the result (penicillin). That arc is an unexpected observation leading to a discovery.`},
{id:"rw23",s:"rw",d:"Information & Ideas",k:"Central ideas",mod:"1",
 p:`<p>Urban planners once assumed that widening highways would reduce traffic congestion. Studies of many cities, however, have found that new lanes tend to fill up within a few years, because the added capacity encourages more people to drive. Researchers call this effect "induced demand."</p>`,
 q:`Which choice best states the main idea of the text?`,
 c:["Adding highway lanes often fails to reduce congestion over time because it draws more drivers.","Urban planners have stopped building new highways.","Traffic congestion is caused mainly by poorly designed exits.","Researchers disagree about whether induced demand exists."],a:0,
 x:`The text sets up an old assumption and then the finding that new lanes fill up because more people drive. The other choices add claims the text never makes.`},
{id:"rw24",s:"rw",d:"Information & Ideas",k:"Command of evidence (textual)",mod:"1",
 p:`<p>A biologist hypothesizes that a species of desert lizard changes color mainly to regulate its body temperature rather than to hide from predators.</p>`,
 q:`Which finding, if true, would most directly support the biologist's hypothesis?`,
 c:["The lizards turned darker on cool mornings and lighter on hot afternoons, even in enclosures with no predators.","The lizards are difficult for researchers to spot in the wild.","Hawks and snakes are the lizard's most common predators.","The lizards changed color more often when birds flew overhead."],a:0,
 x:`To support "temperature, not predators," you need color changes that track temperature with predators removed. The bird-overhead finding would point toward hiding instead.`},
{id:"rw25",s:"rw",d:"Expression of Ideas",k:"Transitions",mod:"1",
 p:`<p>Early photographs required subjects to sit perfectly still for long exposures, sometimes lasting minutes. ______ people in early portraits rarely smile; holding a grin that long was difficult.</p>`,q:TR,
 c:["As a result,","However,","In addition,","For instance,"],a:0,
 x:`Long exposures <i>caused</i> the lack of smiles. Cause to effect calls for <b>As a result</b>.`},
{id:"rw26",s:"rw",d:"Expression of Ideas",k:"Transitions",mod:"1",
 p:`<p>At its spring meeting, the city council approved funding for three new parks. ______ it postponed a vote on the proposed bike lane network until next year.</p>`,q:TR,
 c:["However,","Therefore,","For example,","Similarly,"],a:0,
 x:`The council acted on one plan but put off the other. That is a contrast, so <b>However</b>.`},
{id:"rw27",s:"rw",d:"Expression of Ideas",k:"Rhetorical synthesis",mod:"1",
 p:`<p>While researching a topic, a student has taken the following notes:</p><ul><li>Hedy Lamarr was a film actress in the 1940s.</li><li>With composer George Antheil, she co-invented a frequency-hopping system to keep radio-guided torpedoes from being jammed.</li><li>The pair received a patent for the system in 1942.</li><li>Frequency hopping later contributed to technologies such as Wi-Fi and Bluetooth.</li></ul>`,
 q:`The student wants to emphasize the lasting significance of Lamarr's invention. Which choice most effectively uses relevant information from the notes to accomplish this goal?`,
 c:["Hedy Lamarr's 1942 frequency-hopping invention, created with George Antheil, later helped make technologies like Wi-Fi and Bluetooth possible.","Hedy Lamarr was a 1940s film actress who worked with composer George Antheil.","In 1942, Lamarr and Antheil received a patent for a frequency-hopping system.","Lamarr's frequency-hopping system was designed to keep torpedoes from being jammed."],a:0,
 x:`"Lasting significance" means its later impact. Only one choice mentions what the invention led to (Wi-Fi and Bluetooth).`},

/* ===== R&W Module 2: standard ===== */
{id:"rwe1",s:"rw",d:"Craft & Structure",k:"Words in context",mod:"E",
 p:`<p>The nature trail is so ______ that even small children can complete it without difficulty.</p>`,q:WIC,
 c:["gentle","grueling","remote","hazardous"],a:0,x:`Small children can finish it easily, so the trail must be easy: <b>gentle</b>.`},
{id:"rwe2",s:"rw",d:"Craft & Structure",k:"Words in context",mod:"E",
 p:`<p>The chef is known for her ______ approach to baking: she measures every ingredient precisely and never improvises.</p>`,q:WIC,
 c:["methodical","careless","spontaneous","casual"],a:0,x:`Precise measuring and no improvising describe a <b>methodical</b> approach. "Spontaneous" is the opposite.`},
{id:"rwe3",s:"rw",d:"Craft & Structure",k:"Words in context",mod:"E",
 p:`<p>The scientists were ______ by the results, which showed exactly the opposite of what they had predicted.</p>`,q:WIC,
 c:["surprised","reassured","bored","unaffected"],a:0,x:`Results opposite to a prediction would <b>surprise</b> researchers.`},
{id:"rwe4",s:"rw",d:"Craft & Structure",k:"Words in context",mod:"E",
 p:`<p>Because the old bridge could no longer ______ heavy trucks, the city built a stronger one beside it.</p>`,q:WIC,
 c:["support","admire","ignore","invite"],a:0,x:`A bridge that needs replacing with a "stronger one" can't hold, or <b>support</b>, heavy loads.`},
{id:"rwe5",s:"rw",d:"Craft & Structure",k:"Text structure and purpose",mod:"E",
 p:`<p>Sea otters often float on their backs while eating. They place a rock on their chests and smash clams and other shellfish against it to break them open. This habit makes sea otters one of the few mammals other than primates known to use tools.</p>`,
 q:`Which choice best states the main purpose of the text?`,
 c:["To describe a behavior of sea otters and explain why it is notable","To compare the diets of sea otters and primates","To argue that sea otters are endangered","To explain how clams form their shells"],a:0,
 x:`The text describes the rock habit, then says why it stands out (tool use is rare among mammals).`},
{id:"rwe6",s:"rw",d:"Craft & Structure",k:"Text structure and purpose",mod:"E",
 p:`<p>The following text is from a student's letter to the school newspaper.</p><p>Our recycling bins are often filled with trash, which ruins the recyclables inside. If every classroom had a clearly labeled bin and a short lesson on what can be recycled, much less material would end up in landfills.</p>`,
 q:`Which choice best states the main purpose of the text?`,
 c:["To propose a solution to a problem at the school","To describe the history of recycling programs","To praise the school's current recycling system","To explain how landfills are built"],a:0,
 x:`The letter names a problem (contaminated bins) and then suggests a fix (labeled bins plus a lesson).`},
{id:"rwe7",s:"rw",d:"Craft & Structure",k:"Cross-text connections",mod:"E",
 p:`<p><b>Text 1</b><br>Some nutrition experts claim that eating breakfast is essential for students' concentration in morning classes.</p><p><b>Text 2</b><br>A recent study of high school students found no significant difference in morning quiz scores between students who ate breakfast and those who did not. The researchers noted, though, that their study was small.</p>`,
 q:`Based on the texts, how would the researchers in Text 2 most likely respond to the claim in Text 1?`,
 c:["By noting that their study did not find the effect the experts describe, while acknowledging its limits","By agreeing completely that breakfast is essential for concentration","By arguing that eating breakfast harms concentration","By recommending that students eat larger breakfasts"],a:0,
 x:`Text 2 found no difference but called its study small. So the researchers would question the claim cautiously, not reject or endorse it outright.`},
{id:"rwe8",s:"rw",d:"Information & Ideas",k:"Central ideas",mod:"E",
 p:`<p>Bamboo is one of the fastest-growing plants on Earth; some species can grow nearly a meter in a single day. Because it regrows quickly after being cut, bamboo is increasingly used as a building material and as a replacement for slower-growing trees in products such as flooring.</p>`,
 q:`Which choice best states the main idea of the text?`,
 c:["Bamboo's rapid growth makes it a useful, renewable material.","Bamboo is stronger than any type of wood.","Bamboo grows only in tropical regions.","Most flooring is now made from bamboo."],a:0,
 x:`Both sentences connect fast growth to bamboo's usefulness. The other choices make claims the text never states.`},
{id:"rwe9",s:"rw",d:"Information & Ideas",k:"Central ideas",mod:"E",
 p:`<p>The Great Wall of China is not a single wall but a series of walls built over many centuries by different dynasties. Some early sections were made of packed earth, while later sections used stone and brick.</p>`,
 q:`According to the text, what is true about the Great Wall of China?`,
 c:["It was built over a long period using different materials.","It was completed by a single dynasty.","It is made entirely of stone.","It was built in about ten years."],a:0,
 x:`"Many centuries," "different dynasties," and "packed earth ... stone and brick" all point to the same choice.`},
{id:"rwe10",s:"rw",d:"Information & Ideas",k:"Inferences",mod:"E",
 p:`<p>In a classroom experiment, one group of bean plants heard music for two hours a day, and another group heard none. Both groups received the same amount of water and sunlight. After six weeks, the plants in both groups were the same average height. Based on this result, the students concluded that ______</p>`,
 q:`Which choice most logically completes the text?`,
 c:["music did not affect how tall the plants grew in this experiment.","music made the plants grow faster.","water has no effect on how plants grow.","sunlight matters more to plants than music does."],a:0,
 x:`Everything was equal except music, and heights matched. So music made no difference here. Water and sunlight were held constant, so the text can't tell us anything about them.`},
{id:"rwe11",s:"rw",d:"Information & Ideas",k:"Command of evidence (textual)",mod:"E",
 p:`<p>A student claims that, in a short story, the main character, Dana, feels nervous before her first day at a new job.</p>`,
 q:`Which sentence from the story best supports the student's claim?`,
 c:["Dana checked her bag for the third time, making sure she had remembered everything.","The office building was tall and made of glass.","Dana had always enjoyed reading on the train.","Her new manager's name was Mr. Alvarez."],a:0,
 x:`Checking a bag a third time is a nervous behavior. The other sentences give setting or facts, not feelings.`},
{id:"rwe12",s:"rw",d:"Information & Ideas",k:"Command of evidence (quantitative)",mod:"E",
 p:`<p>A librarian recorded visits to a small-town library.</p><div class="scroll"><table><tr><th>Month</th><th>Visits</th></tr><tr><td>January</td><td>1,200</td></tr><tr><td>February</td><td>1,450</td></tr><tr><td>March</td><td>1,700</td></tr></table></div><p>The librarian claims that visits increased every month from January to March.</p>`,
 q:`Which choice most effectively uses data from the table to support the claim?`,
 c:["Visits rose from 1,200 in January to 1,450 in February and then to 1,700 in March.","The library had 1,700 visits in March.","The library had fewer visits in January than in March.","The library had more than 1,000 visits in each month."],a:0,
 x:`"Every month" requires all three months in order. Comparing only January and March skips February.`},
{id:"rwe13",s:"rw",d:"Information & Ideas",k:"Inferences",mod:"E",
 p:`<p>Monarch butterflies lay their eggs only on milkweed plants, and monarch caterpillars eat only milkweed leaves. In recent decades, milkweed has disappeared from many farm fields. It is therefore likely that ______</p>`,
 q:`Which choice most logically completes the text?`,
 c:["the loss of milkweed has made it harder for monarchs to reproduce in those areas.","monarch caterpillars have started eating other kinds of leaves.","farmers have begun planting more milkweed.","monarch caterpillars no longer need to eat."],a:0,
 x:`Monarchs depend <i>only</i> on milkweed, and it's disappearing, so reproduction in those areas suffers. The other choices contradict "only."`},
{id:"rwe14",s:"rw",d:"Information & Ideas",k:"Central ideas",mod:"E",
 p:`<p>Grandmother's kitchen was always warm, even in January. The kettle hummed on the stove, and the windows fogged as soon as anyone stepped inside. For Rosa, the room meant more than heat: it was the one place where every visit felt exactly the same, no matter what had changed outside.</p>`,
 q:`Which choice best describes what the kitchen means to Rosa?`,
 c:["A place of comfort and consistency","A room she found uncomfortably hot","A place she visited only in winter","A reminder of how much had changed"],a:0,
 x:`"Exactly the same, no matter what had changed outside" signals that the kitchen stays constant for her, and the warmth details suggest comfort.`},
{id:"rwe15",s:"rw",d:"Standard English Conventions",k:"Boundaries",mod:"E",
 p:`<p>My brother loves mystery ______ he reads at least two of them every week.</p>`,q:SEC,
 c:["novels;","novels,","novels","novels, because of this"],a:0,
 x:`Two complete sentences need a period or semicolon between them. A comma alone, or nothing, is incorrect.`},
{id:"rwe16",s:"rw",d:"Standard English Conventions",k:"Subject-verb agreement",mod:"E",
 p:`<p>The students in the art class ______ painting a mural for the cafeteria wall.</p>`,q:SEC,
 c:["are","is","was","has been"],a:0,x:`The subject is <i>students</i> (plural), not <i>class</i>. Plural subject → <b>are</b>.`},
{id:"rwe17",s:"rw",d:"Standard English Conventions",k:"Pronouns",mod:"E",
 p:`<p>When Maria and Jen finished their science project, ______ celebrated with pizza.</p>`,q:SEC,
 c:["they","she","it","them"],a:0,x:`Two people are the subject, so the pronoun must be plural and a subject form: <b>they</b>.`},
{id:"rwe18",s:"rw",d:"Standard English Conventions",k:"Verb tense",mod:"E",
 p:`<p>Last summer, my family ______ to the Grand Canyon for the first time.</p>`,q:SEC,
 c:["traveled","travels","will travel","is traveling"],a:0,x:`"Last summer" sets the action in the past: <b>traveled</b>.`},
{id:"rwe19",s:"rw",d:"Standard English Conventions",k:"Boundaries",mod:"E",
 p:`<p>For the camping trip, we packed a tent, sleeping ______ and a flashlight.</p>`,q:SEC,
 c:["bags,","bags","bags;","bags:"],a:0,x:`Items in a simple list of three are separated by commas: tent, sleeping bags, and a flashlight.`},
{id:"rwe20",s:"rw",d:"Standard English Conventions",k:"Possessives",mod:"E",
 p:`<p>The ______ tail began to wag as soon as she heard her owner's car in the driveway.</p>`,q:SEC,
 c:["dog's","dogs","dogs'","dogs's"],a:0,x:`One dog ("she"), and the tail belongs to her: singular possessive <b>dog's</b>.`},
{id:"rwe21",s:"rw",d:"Standard English Conventions",k:"Possessives",mod:"E",
 p:`<p>Every spring, thousands of ______ visit the national park to see the wildflowers in bloom.</p>`,q:SEC,
 c:["tourists","tourist's","tourists'","tourists's"],a:0,x:`Nothing belongs to the tourists here; it's just a plural noun, so no apostrophe.`},
{id:"rwe22",s:"rw",d:"Expression of Ideas",k:"Transitions",mod:"E",
 p:`<p>Elephants have excellent long-term memories. ______ they can remember the locations of water sources they visited years earlier.</p>`,q:TR,
 c:["For example,","However,","Instead,","Nevertheless,"],a:0,x:`The second sentence is an example of good memory: <b>For example</b>.`},
{id:"rwe23",s:"rw",d:"Expression of Ideas",k:"Transitions",mod:"E",
 p:`<p>The science museum was closed on Monday for repairs. ______ our class rescheduled its field trip for Tuesday.</p>`,q:TR,
 c:["Therefore,","In contrast,","For example,","Similarly,"],a:0,x:`The closure caused the rescheduling. Cause to effect: <b>Therefore</b>.`},
{id:"rwe24",s:"rw",d:"Expression of Ideas",k:"Transitions",mod:"E",
 p:`<p>Cacti survive in the desert by storing water in their thick stems. ______ mesquite trees survive by growing roots that reach water far underground.</p>`,q:TR,
 c:["By contrast,","As a result,","For instance,","Therefore,"],a:0,x:`Two different survival strategies are being compared, so <b>By contrast</b>.`},
{id:"rwe25",s:"rw",d:"Expression of Ideas",k:"Rhetorical synthesis",mod:"E",
 p:`<p>While researching a topic, a student has taken the following notes:</p><ul><li>The Golden Gate Bridge opened in 1937.</li><li>It is located in San Francisco, California.</li><li>Its color is called "International Orange."</li><li>The color was chosen partly so the bridge would be visible in fog.</li></ul>`,
 q:`The student wants to explain why the bridge has its color. Which choice most effectively uses relevant information from the notes to accomplish this goal?`,
 c:["The Golden Gate Bridge's \"International Orange\" color was chosen partly to keep the bridge visible in fog.","The Golden Gate Bridge opened in San Francisco in 1937.","The Golden Gate Bridge is located in San Francisco, California.","The Golden Gate Bridge, which opened in 1937, is painted \"International Orange.\""],a:0,
 x:`The goal asks <i>why</i>. Only one choice gives a reason (visibility in fog).`},
{id:"rwe26",s:"rw",d:"Expression of Ideas",k:"Rhetorical synthesis",mod:"E",
 p:`<p>While researching a topic, a student has taken the following notes:</p><ul><li>The axolotl is a salamander native to lakes near Mexico City.</li><li>Axolotls can regrow lost limbs.</li><li>Scientists study axolotls to learn about healing.</li></ul>`,
 q:`The student wants to introduce the axolotl to an audience unfamiliar with it. Which choice most effectively uses relevant information from the notes to accomplish this goal?`,
 c:["The axolotl, a salamander native to lakes near Mexico City, is known for its ability to regrow lost limbs.","Scientists study axolotls to learn about healing.","Axolotls can regrow lost limbs, which interests scientists.","Lakes near Mexico City are home to many animals."],a:0,
 x:`An unfamiliar audience first needs to know what an axolotl <i>is</i>. Only one choice says it's a salamander and where it lives.`},
{id:"rwe27",s:"rw",d:"Expression of Ideas",k:"Transitions",mod:"E",
 p:`<p>The first draft of Lena's essay was confusing and disorganized. ______ her final version was clear and easy to follow.</p>`,q:TR,
 c:["By contrast,","Similarly,","Therefore,","For example,"],a:0,x:`Confusing draft vs. clear final: a contrast.`},

/* ===== R&W Module 2: harder ===== */
{id:"rwh1",s:"rw",d:"Craft & Structure",k:"Words in context",mod:"H",
 p:`<p>Although the mayor's remarks at the press conference seemed ______, a close reading of her prepared statement revealed a carefully hedged position that committed the city to very little.</p>`,q:WIC,
 c:["unequivocal","tentative","evasive","perfunctory"],a:0,
 x:`"Although" sets up a contrast with "carefully hedged." So the remarks must have <i>seemed</i> firm and definite: <b>unequivocal</b>. "Tentative" and "evasive" describe the hedged reality, not the contrasting impression.`},
{id:"rwh2",s:"rw",d:"Craft & Structure",k:"Words in context",mod:"H",
 p:`<p>The historian's account of the trade dispute is admirably ______: rather than favoring either nation, she presents each government's reasoning on its own terms and lets readers weigh the evidence.</p>`,q:WIC,
 c:["evenhanded","polemical","cursory","anachronistic"],a:0,
 x:`Not favoring either side = <b>evenhanded</b>. "Polemical" means aggressively one-sided; "cursory" means hasty and shallow.`},
{id:"rwh3",s:"rw",d:"Craft & Structure",k:"Words in context",mod:"H",
 p:`<p>For decades, the novelist's early stories were treated as mere ______ of her later masterpieces, interesting mainly for what they anticipated; recent critics, however, argue that the stories deserve attention on their own merits.</p>`,q:WIC,
 c:["precursors","refutations","imitations","summaries"],a:0,
 x:`"Interesting mainly for what they anticipated" means valued as early forerunners: <b>precursors</b>. Early stories can't imitate or summarize works written later.`},
{id:"rwh4",s:"rw",d:"Craft & Structure",k:"Words in context",mod:"H",
 p:`<p>The drought's effects on the region's farms were ______ at first, amounting to only slightly lower yields in a few fields, but over three dry seasons those effects compounded into a crisis.</p>`,q:WIC,
 c:["marginal","catastrophic","unprecedented","deliberate"],a:0,
 x:`"Only slightly lower yields in a few fields" defines the blank: small, <b>marginal</b>. "Catastrophic" describes where things ended up, not where they began.`},
{id:"rwh5",s:"rw",d:"Craft & Structure",k:"Text structure and purpose",mod:"H",
 p:`<p>Ecologists have long described kelp forests as fragile, quick to collapse when sea urchin populations explode and graze the kelp away. Recent surveys at several coastal sites complicate this picture: kelp recovered within a few years once urchin predators such as lobsters were protected from fishing. The researchers suggest that kelp forests may be better described as resilient, capable of rebounding when key predators return.</p>`,
 q:`Which choice best describes the function of the second sentence in the overall structure of the text?`,
 c:["It presents evidence that challenges a widely held characterization.","It introduces the main claim that the researchers later reject.","It explains the method researchers used to count urchins.","It offers an example that supports the view in the first sentence."],a:0,
 x:`Sentence 1 gives the long-held view (fragile). Sentence 2 says new surveys "complicate this picture," offering evidence against it. Sentence 3 then states the researchers' alternative.`},
{id:"rwh6",s:"rw",d:"Craft & Structure",k:"Text structure and purpose",mod:"H",
 p:`<p>The company announced that its new battery could store twice as much energy as current models at the same cost, at least for now, in laboratory conditions. Engineers caution that manufacturing the batteries at scale may reveal problems that small test batches did not.</p>`,
 q:`The phrase "at least for now, in laboratory conditions" mainly serves to`,
 c:["qualify the announcement by indicating that its results have been shown only in a limited setting.","emphasize that the battery is already widely sold.","suggest that laboratory tests are generally unreliable.","explain why the battery costs the same as current models."],a:0,
 x:`The phrase narrows the claim: the result holds so far, and only in the lab. That's a qualification, which the next sentence about scaling up reinforces.`},
{id:"rwh7",s:"rw",d:"Craft & Structure",k:"Cross-text connections",mod:"H",
 p:`<p><b>Text 1</b><br>Many linguists have assumed that languages spoken in mountainous regions tend to develop unusually large sets of speech sounds, reasoning that isolated communities diverge from their neighbors over time.</p><p><b>Text 2</b><br>Linguist Priya Raman analyzed a database of nearly 600 languages. She found that languages spoken at high altitudes were no more likely than others to have large sound inventories once she accounted for whether neighboring languages shared a common ancestor.</p>`,
 q:`Based on the texts, how would Raman (Text 2) most likely respond to the assumption described in Text 1?`,
 c:["She would argue that the apparent link may disappear when shared ancestry among languages is taken into account.","She would agree that isolation is the main cause of large sound inventories.","She would claim that mountain languages have fewer sounds than other languages.","She would suggest that her database should exclude languages spoken at low altitudes."],a:0,
 x:`Raman's finding: no altitude effect <i>after controlling for shared ancestry</i>. So she'd say the assumed link may come from related languages clustering together. She never claims mountain languages have <i>fewer</i> sounds.`},
{id:"rwh8",s:"rw",d:"Information & Ideas",k:"Central ideas",mod:"H",
 p:`<p>The following text is adapted from a novel. Theo has just arrived by train in the city where he plans to live.</p><p>Theo had imagined the city as a single bright thing, a promise kept at the end of a long road. Now, standing on the platform, he saw it was something stranger: a thousand separate lives, each hurrying past him toward its own small destination, none of them waiting for him.</p>`,
 q:`Which choice best states the main idea of the text?`,
 c:["Theo realizes that the city is not the unified, welcoming place he had imagined.","Theo is relieved that the crowd does not notice him.","Theo regrets leaving home and plans to return.","Theo is impressed by how efficiently the trains run."],a:0,
 x:`The text contrasts what Theo imagined ("a single bright thing ... a promise") with what he sees ("separate lives ... none of them waiting for him"). Relief and regret are never stated.`},
{id:"rwh9",s:"rw",d:"Information & Ideas",k:"Inferences",mod:"H",
 p:`<p>To test whether a bird species can recognize individual human faces, researchers wearing a distinctive mask briefly captured several birds and then released them unharmed. Over the following months, birds scolded and mobbed anyone wearing that mask, including birds that had never been captured, while ignoring people wearing a different, neutral mask. This suggests that ______</p>`,
 q:`Which choice most logically completes the text?`,
 c:["birds can learn to associate a face with danger by observing the reactions of other birds.","birds react with alarm to any person wearing a mask.","the captured birds quickly forgot the experience.","birds prefer the color of the neutral mask."],a:0,
 x:`Uncaptured birds also mobbed the mask, so they must have learned from other birds. Birds ignored the neutral mask, which rules out "any mask."`},
{id:"rwh10",s:"rw",d:"Information & Ideas",k:"Command of evidence (textual)",mod:"H",
 p:`<p>Some literary scholars argue that in the final scene of a play, the character Mara's silence signals defiance rather than defeat.</p>`,
 q:`Which stage direction from the play's final scene would most directly support the scholars' argument?`,
 c:["Mara meets the governor's gaze, does not lower her eyes, and remains standing after the others have knelt.","Mara sits alone, her shoulders slumped, as the lights fade.","The governor speaks at length about the history of the province.","Mara folds the letter carefully and places it on the table."],a:0,
 x:`Holding someone's gaze and refusing to kneel are acts of defiance. Slumped shoulders suggest defeat, the opposite of the claim.`},
{id:"rwh11",s:"rw",d:"Information & Ideas",k:"Command of evidence (quantitative)",mod:"H",
 p:`<p>Percentage of survey respondents who used public transit at least weekly</p><div class="scroll"><table><tr><th>City</th><th>2015</th><th>2020</th><th>2025</th></tr><tr><td>Ardale</td><td>32%</td><td>28%</td><td>35%</td></tr><tr><td>Bexton</td><td>18%</td><td>22%</td><td>27%</td></tr><tr><td>Corvin</td><td>41%</td><td>30%</td><td>33%</td></tr></table></div><p>An urban planner argues that among the three cities, only Bexton showed a steady increase in weekly transit use across all three survey years.</p>`,
 q:`Which choice most effectively uses data from the table to support the planner's argument?`,
 c:["Bexton's rate rose from 18% to 22% to 27%, whereas the rates in Ardale and Corvin each fell between 2015 and 2020.","Corvin had the highest rate in 2015, at 41%.","Ardale's rate in 2025 (35%) was higher than its rate in 2015 (32%).","All three cities had rates above 25% in 2025."],a:0,
 x:`"Only Bexton" needs two things: Bexton rose every time, <i>and</i> the others didn't. Only one choice shows both. The 2025 statement is true but irrelevant.`},
{id:"rwh12",s:"rw",d:"Information & Ideas",k:"Inferences",mod:"H",
 p:`<p>Some economists have proposed that rising rents in a neighborhood mainly reflect the higher incomes of new residents. In a study of several cities, however, rents also rose sharply in neighborhoods where average incomes stayed flat, and in each of those neighborhoods the number of available housing units had declined. These findings suggest that ______</p>`,
 q:`Which choice most logically completes the text?`,
 c:["a shrinking housing supply may drive rent increases even without a rise in residents' incomes.","rising incomes have no connection to rents in any neighborhood.","new residents prefer neighborhoods where housing supply is declining.","rents rise only in neighborhoods where incomes stay flat."],a:0,
 x:`Rents rose with flat incomes, and housing supply had fallen in each case, which points to supply as a possible driver. "No connection in any neighborhood" goes far beyond what one study shows.`},
{id:"rwh13",s:"rw",d:"Information & Ideas",k:"Central ideas",mod:"H",
 p:`<p>Many plants close the tiny pores on their leaves, called stomata, during hot afternoons to conserve water. Closing the pores, however, also limits how much carbon dioxide the plants take in, slowing photosynthesis. Botanist Lena Ortiz found that one desert shrub avoids this trade-off by opening its stomata at night, when cooler air reduces water loss, and storing carbon dioxide for use during the day.</p>`,
 q:`Which choice best states the main idea of the text?`,
 c:["A desert shrub uses a nighttime strategy to take in carbon dioxide while limiting water loss.","Plants must close their stomata at night in order to photosynthesize.","Desert shrubs lose more water than most other plants.","Ortiz showed that photosynthesis does not require carbon dioxide."],a:0,
 x:`The first two sentences set up a trade-off; the last explains how one shrub avoids it. The main idea is that solution.`},
{id:"rwh14",s:"rw",d:"Information & Ideas",k:"Command of evidence (textual)",mod:"H",
 p:`<p>A researcher hypothesizes that a coastal town's decline in fishing jobs was caused primarily by new fishing regulations introduced in 2010.</p>`,
 q:`Which finding, if true, would most directly weaken the researcher's hypothesis?`,
 c:["The number of fishing jobs in the town had already fallen by more than half between 2000 and 2009.","The 2010 regulations reduced the allowed annual catch by 15 percent.","Many town residents publicly opposed the regulations.","Several nearby towns adopted similar regulations in 2012."],a:0,
 x:`If most of the decline happened <i>before</i> 2010, the regulations can't be the main cause. Weaken questions ask for the choice that breaks the cause-and-effect link.`},
{id:"rwh15",s:"rw",d:"Standard English Conventions",k:"Boundaries",mod:"H",
 p:`<p>The Mexican painter Frida Kahlo, who completed more than fifty self-portraits during her ______ is celebrated for work that blends personal history with folk art traditions.</p>`,q:SEC,
 c:["career,","career","career;","career—"],a:0,
 x:`The clause "who completed ... career" is extra information opened with a comma, so it must close with a matching comma. Cross it out and the sentence still works: "Frida Kahlo is celebrated..."`},
{id:"rwh16",s:"rw",d:"Standard English Conventions",k:"Boundaries",mod:"H",
 p:`<p>The music festival will feature performers from Lagos, ______ Accra, Ghana; and Dakar, Senegal.</p>`,q:SEC,
 c:["Nigeria;","Nigeria,","Nigeria","Nigeria:"],a:0,
 x:`When list items already contain commas ("Lagos, Nigeria"), semicolons separate the items. The rest of the list already uses semicolons, so match it.`},
{id:"rwh17",s:"rw",d:"Standard English Conventions",k:"Subject-verb agreement",mod:"H",
 p:`<p>Neither the coach nor the players ______ aware that the championship game had been postponed.</p>`,q:SEC,
 c:["were","was","is","has been"],a:0,
 x:`With "neither ... nor," the verb agrees with the closer subject: <i>players</i> (plural). Past context → <b>were</b>.`},
{id:"rwh18",s:"rw",d:"Standard English Conventions",k:"Subject-verb agreement",mod:"H",
 p:`<p>Among the most significant finds at the excavation site ______ a set of bronze tools and a carved stone tablet.</p>`,q:SEC,
 c:["were","was","is","has been"],a:0,
 x:`The sentence is inverted. The real subject comes after the verb: "a set of bronze tools <i>and</i> a carved stone tablet," two things, so plural <b>were</b>.`},
{id:"rwh19",s:"rw",d:"Standard English Conventions",k:"Pronouns",mod:"H",
 p:`<p>After analyzing data from thousands of stars, the research team published ______ findings, which suggested that the galaxy is older than previously thought.</p>`,q:SEC,
 c:["its","their","it's","they're"],a:0,
 x:`<i>Team</i> is a singular collective noun, so the test expects the singular possessive <b>its</b>.`},
{id:"rwh20",s:"rw",d:"Standard English Conventions",k:"Modifiers",mod:"H",
 p:`<p>Discovered in a dusty archive in 2019, ______</p>`,q:SEC,
 c:["the letters revealed that the composer had secretly collaborated with a rival.","historians learned from the letters that the composer had secretly collaborated with a rival.","the composer's secret collaboration with a rival was revealed by the letters.","a secret collaboration between the composer and a rival was revealed."],a:0,
 x:`What was "discovered in a dusty archive"? The letters. They must come right after the comma.`},
{id:"rwh21",s:"rw",d:"Standard English Conventions",k:"Boundaries",mod:"H",
 p:`<p>The study's conclusion was ______ students who slept at least eight hours performed better on memory tests than students who did not.</p>`,q:SEC,
 c:["clear:","clear,","clear","clear, that"],a:0,
 x:`A complete sentence ("The study's conclusion was clear") followed by the explanation of what the conclusion was takes a colon. A comma alone creates a comma splice.`},
{id:"rwh22",s:"rw",d:"Expression of Ideas",k:"Transitions",mod:"H",
 p:`<p>Early computers filled entire rooms and required teams of specialists to operate. ______ today's smartphones, which fit in a pocket, are millions of times more powerful.</p>`,q:TR,
 c:["By comparison,","Consequently,","Likewise,","For instance,"],a:0,
 x:`The text sets old computers against modern phones: <b>By comparison</b>. Early computers didn't <i>cause</i> phones to be more powerful.`},
{id:"rwh23",s:"rw",d:"Expression of Ideas",k:"Transitions",mod:"H",
 p:`<p>The new vaccine performed well in early trials. Researchers caution, ______ that larger studies are needed before it can be approved for general use.</p>`,q:TR,
 c:["however,","therefore,","for example,","similarly,"],a:0,
 x:`Good early results vs. a warning that more study is needed: a contrast, even though the transition sits mid-sentence.`},
{id:"rwh24",s:"rw",d:"Expression of Ideas",k:"Transitions",mod:"H",
 p:`<p>Many critics praised the film's striking visual effects. The screenplay, ______ was widely criticized as predictable.</p>`,q:TR,
 c:["on the other hand,","for instance,","as a result,","in addition,"],a:0,
 x:`Praise for effects vs. criticism of the screenplay: <b>on the other hand</b>.`},
{id:"rwh25",s:"rw",d:"Expression of Ideas",k:"Transitions",mod:"H",
 p:`<p>The new model of the solar system explained nearly all of the astronomers' observations. ______ it could not account for the unusual orbit of one small moon.</p>`,q:TR,
 c:["Still,","Thus,","Specifically,","Moreover,"],a:0,
 x:`"Explained nearly all" followed by one thing it couldn't explain is a concession. <b>Still</b> means "despite that."`},
{id:"rwh26",s:"rw",d:"Expression of Ideas",k:"Rhetorical synthesis",mod:"H",
 p:`<p>While researching a topic, a student has taken the following notes:</p><ul><li>Wangari Maathai was a Kenyan environmental activist.</li><li>In 1977, she founded the Green Belt Movement.</li><li>The movement has planted tens of millions of trees in Kenya.</li><li>In 2004, Maathai became the first African woman to receive the Nobel Peace Prize.</li></ul>`,
 q:`The student wants to present the Green Belt Movement's accomplishments to an audience already familiar with Maathai. Which choice most effectively uses relevant information from the notes to accomplish this goal?`,
 c:["Since Maathai founded it in 1977, the Green Belt Movement has planted tens of millions of trees across Kenya.","Wangari Maathai, a Kenyan environmental activist, founded the Green Belt Movement in 1977.","In 2004, Maathai became the first African woman to receive the Nobel Peace Prize.","The Green Belt Movement was founded in Kenya in 1977."],a:0,
 x:`Two parts to the goal: the <i>movement's</i> accomplishment, for readers who <i>already know</i> Maathai. Introducing her wastes words; the Nobel is her achievement, not the movement's.`},
{id:"rwh27",s:"rw",d:"Expression of Ideas",k:"Rhetorical synthesis",mod:"H",
 p:`<p>While researching a topic, a student has taken the following notes:</p><ul><li>A study compared two groups of students learning vocabulary.</li><li>Group A studied the words in one long session.</li><li>Group B studied the same words in several short sessions spread over a week.</li><li>One month later, Group B remembered 40% more words than Group A.</li></ul>`,
 q:`The student wants to emphasize the study's finding. Which choice most effectively uses relevant information from the notes to accomplish this goal?`,
 c:["Students who spread their studying over several short sessions remembered 40% more words a month later than students who studied in one long session.","A study compared two groups of students who were learning vocabulary.","Group A studied in one long session, while Group B studied in several short sessions.","The study involved students learning vocabulary words over a week."],a:0,
 x:`A <i>finding</i> is a result. Only one choice reports what happened (40% more words remembered). The others describe the setup.`},

/* ===== Math Module 2: standard ===== */
{id:"me1",s:"m",d:"Algebra",k:"Linear equations",mod:"E",q:`If 5<i>x</i> = 35, what is the value of <i>x</i>?`,c:["5","6","7","8"],a:2,x:`Divide both sides by 5: <i>x</i> = 7.`},
{id:"me2",s:"m",d:"Algebra",k:"Linear equations",mod:"E",q:`If 2(<i>x</i> − 3) = 10, what is the value of <i>x</i>?`,c:["2","5","8","13"],a:2,x:`Divide by 2: <i>x</i> − 3 = 5, so <i>x</i> = 8. Choice 5 is the trap (stopping at <i>x</i> − 3).`},
{id:"me3",s:"m",d:"Algebra",k:"Slope",mod:"E",t:"gi",ans:[4],q:`What is the slope of the line with equation <i>y</i> = 4<i>x</i> − 2?`,x:`In <i>y</i> = <i>mx</i> + <i>b</i>, the slope is <i>m</i> = <b>4</b>.`},
{id:"me4",s:"m",d:"Algebra",k:"Linear models",mod:"E",q:`A phone plan costs $15 per month plus $0.10 per text message. What is the total monthly cost for a month with 200 text messages?`,c:["$17","$20","$35","$215"],a:2,x:`200 × $0.10 = $20, plus $15 = $35.`},
{id:"me5",s:"m",d:"Algebra",k:"Linear equations",mod:"E",q:`Which point lies on the line <i>y</i> = 2<i>x</i> + 1?`,c:["(1, 2)","(1, 3)","(2, 3)","(3, 1)"],a:1,x:`Plug in <i>x</i> = 1: <i>y</i> = 2(1) + 1 = 3. So (1, 3) works.`},
{id:"me6",s:"m",d:"Algebra",k:"Linear inequalities",mod:"E",q:`Which value of <i>x</i> satisfies the inequality <i>x</i> + 4 > 9?`,c:["3","4","5","6"],a:3,x:`<i>x</i> > 5. Only 6 is greater than 5. (5 itself doesn't work, since 9 > 9 is false.)`},
{id:"me7",s:"m",d:"Algebra",k:"Systems of equations",mod:"E",t:"gi",ans:[3],q:`<i>y</i> = 3<i>x</i><br><i>x</i> + <i>y</i> = 12<br>What is the value of <i>x</i> in the solution to the system above?`,x:`Substitute: <i>x</i> + 3<i>x</i> = 12, so 4<i>x</i> = 12 and <i>x</i> = <b>3</b>.`},
{id:"me8",s:"m",d:"Algebra",k:"Linear models",mod:"E",t:"gi",ans:[8],q:`A taxi charges $3 plus $2 per mile. If a ride cost $19, how many miles long was the ride?`,x:`3 + 2<i>m</i> = 19 → 2<i>m</i> = 16 → <i>m</i> = <b>8</b>.`},
{id:"me9",s:"m",d:"Advanced Math",k:"Equivalent expressions",mod:"E",q:`Which expression is equivalent to 3(<i>x</i><sup>2</sup> + 2<i>x</i>)?`,c:["3<i>x</i><sup>2</sup> + 2<i>x</i>","3<i>x</i><sup>2</sup> + 6<i>x</i>","<i>x</i><sup>2</sup> + 6<i>x</i>","6<i>x</i><sup>3</sup>"],a:1,x:`Distribute the 3 to both terms: 3<i>x</i><sup>2</sup> + 6<i>x</i>.`},
{id:"me10",s:"m",d:"Advanced Math",k:"Function notation",mod:"E",q:`If <i>f</i>(<i>x</i>) = <i>x</i><sup>2</sup> + 1, what is <i>f</i>(3)?`,c:["7","9","10","16"],a:2,x:`3<sup>2</sup> + 1 = 10.`},
{id:"me11",s:"m",d:"Advanced Math",k:"Quadratics",mod:"E",q:`What are the solutions to <i>x</i><sup>2</sup> = 49?`,c:["7 only","−7 and 7","−49 and 49","24.5 only"],a:1,x:`Both 7<sup>2</sup> and (−7)<sup>2</sup> equal 49. Don't forget the negative solution.`},
{id:"me12",s:"m",d:"Advanced Math",k:"Equivalent expressions",mod:"E",q:`Which expression is equivalent to (2<i>x</i>)(3<i>x</i>)?`,c:["5<i>x</i>","6<i>x</i>","5<i>x</i><sup>2</sup>","6<i>x</i><sup>2</sup>"],a:3,x:`Multiply coefficients (2 × 3 = 6) and variables (<i>x</i> · <i>x</i> = <i>x</i><sup>2</sup>).`},
{id:"me13",s:"m",d:"Advanced Math",k:"Factoring",mod:"E",q:`Which expression is equivalent to <i>x</i><sup>2</sup> − 9?`,c:["(<i>x</i> − 3)<sup>2</sup>","(<i>x</i> − 3)(<i>x</i> + 3)","(<i>x</i> − 9)(<i>x</i> + 1)","(<i>x</i> + 3)<sup>2</sup>"],a:1,x:`Difference of squares: <i>a</i><sup>2</sup> − <i>b</i><sup>2</sup> = (<i>a</i> − <i>b</i>)(<i>a</i> + <i>b</i>).`},
{id:"me14",s:"m",d:"Advanced Math",k:"Exponents",mod:"E",t:"gi",ans:[5],q:`If 2<sup><i>x</i></sup> = 32, what is the value of <i>x</i>?`,x:`2 × 2 × 2 × 2 × 2 = 32, so <i>x</i> = <b>5</b>.`},
{id:"me15",s:"m",d:"Advanced Math",k:"Exponential functions",mod:"E",q:`An account holds $100 and grows by 10% each year. How much will it hold after 1 year?`,c:["$101","$110","$120","$200"],a:1,x:`10% of $100 is $10, so $100 + $10 = $110.`},
{id:"me16",s:"m",d:"Problem-Solving & Data Analysis",k:"Mean and median",mod:"E",t:"gi",ans:[9],q:`What is the mean of 6, 8, 10, and 12?`,x:`(6 + 8 + 10 + 12) ÷ 4 = 36 ÷ 4 = <b>9</b>.`},
{id:"me17",s:"m",d:"Problem-Solving & Data Analysis",k:"Percentages",mod:"E",q:`What is 30% of 80?`,c:["18","24","26","50"],a:1,x:`0.30 × 80 = 24.`},
{id:"me18",s:"m",d:"Problem-Solving & Data Analysis",k:"Ratios and proportions",mod:"E",q:`A recipe uses 3 cups of flour to make 12 cookies. How many cups of flour are needed to make 36 cookies?`,c:["6","9","12","15"],a:1,x:`36 is 3 times 12, so use 3 × 3 = 9 cups.`},
{id:"me19",s:"m",d:"Problem-Solving & Data Analysis",k:"Probability",mod:"E",q:`A bag contains 4 red marbles and 6 blue marbles. If one marble is chosen at random, what is the probability that it is red?`,c:["1/4","2/5","3/5","2/3"],a:1,x:`4 red out of 10 total = 4/10 = 2/5. The 2/3 trap divides red by blue instead of by the total.`},
{id:"me20",s:"m",d:"Geometry & Trigonometry",k:"Area and perimeter",mod:"E",q:`A rectangle has a length of 7 and a width of 5. What is its area?`,c:["12","24","35","70"],a:2,x:`Area = 7 × 5 = 35. (24 is the perimeter.)`},
{id:"me21",s:"m",d:"Geometry & Trigonometry",k:"Angles",mod:"E",q:`Two angles of a triangle measure 50° and 60°. What is the measure of the third angle?`,c:["60°","70°","80°","90°"],a:1,x:`Triangle angles sum to 180°: 180 − 50 − 60 = 70.`},
{id:"me22",s:"m",d:"Geometry & Trigonometry",k:"Circles",mod:"E",q:`What is the circumference of a circle with radius 5?`,c:["5π","10π","25π","100π"],a:1,x:`<i>C</i> = 2π<i>r</i> = 10π. (25π is the area.)`},

/* ===== Math Module 2: harder ===== */
{id:"mh1",s:"m",d:"Algebra",k:"Systems of equations",mod:"H",t:"gi",ans:[-4],q:`3<i>x</i> − 2<i>y</i> = 7<br>6<i>x</i> + <i>ky</i> = 10<br>In the system above, <i>k</i> is a constant. For what value of <i>k</i> does the system have no solution?`,x:`No solution means parallel lines: same slope, different intercepts. Doubling the first equation gives 6<i>x</i> − 4<i>y</i> = 14. For the second to be parallel, <i>k</i> = <b>−4</b> (and 10 ≠ 14, so the lines don't overlap).`},
{id:"mh2",s:"m",d:"Algebra",k:"Slope",mod:"H",q:`Line ℓ passes through the point (0, 4) and is perpendicular to the line <i>y</i> = −(2/3)<i>x</i> + 1. Which equation defines line ℓ?`,c:["<i>y</i> = −(2/3)<i>x</i> + 4","<i>y</i> = (2/3)<i>x</i> + 4","<i>y</i> = (3/2)<i>x</i> + 4","<i>y</i> = −(3/2)<i>x</i> + 4"],a:2,x:`Perpendicular slopes are negative reciprocals: −2/3 → 3/2. The point (0, 4) is the <i>y</i>-intercept.`},
{id:"mh3",s:"m",d:"Algebra",k:"Linear equations",mod:"H",q:`If <i>x</i>/3 + <i>x</i>/6 = 5, what is the value of <i>x</i>?`,c:["5","10","15","30"],a:1,x:`Multiply everything by 6: 2<i>x</i> + <i>x</i> = 30, so 3<i>x</i> = 30 and <i>x</i> = 10.`},
{id:"mh4",s:"m",d:"Algebra",k:"Linear models",mod:"H",q:`The equation <i>F</i> = 1.8<i>C</i> + 32 converts a temperature <i>C</i> in degrees Celsius to <i>F</i> in degrees Fahrenheit. Which statement must be true?`,c:["An increase of 1 degree Celsius corresponds to an increase of 32 degrees Fahrenheit.","An increase of 1 degree Celsius corresponds to an increase of 1.8 degrees Fahrenheit.","An increase of 1 degree Fahrenheit corresponds to an increase of 1.8 degrees Celsius.","When <i>C</i> = 0, <i>F</i> = 1.8."],a:1,x:`The slope (1.8) is the change in <i>F</i> per 1-unit change in <i>C</i>. The 32 is the starting value when <i>C</i> = 0.`},
{id:"mh5",s:"m",d:"Algebra",k:"Linear equations",mod:"H",t:"gi",ans:[12],q:`A store sells notebooks for $3.00 each and pens for $1.50 each. Mia spent exactly $30.00 and bought 3 times as many pens as notebooks. How many pens did she buy?`,x:`Let <i>n</i> = notebooks, so pens = 3<i>n</i>. 3<i>n</i> + 1.5(3<i>n</i>) = 30 → 7.5<i>n</i> = 30 → <i>n</i> = 4. Pens = 3 × 4 = <b>12</b>. Answer the question asked (pens, not notebooks).`},
{id:"mh6",s:"m",d:"Algebra",k:"Linear equations",mod:"H",q:`In the equation <i>a</i>(<i>x</i> + 2) = 3<i>x</i> + 6, <i>a</i> is a constant. For what value of <i>a</i> does the equation have infinitely many solutions?`,c:["2","3","6","9"],a:1,x:`Infinitely many solutions means both sides are identical. 3<i>x</i> + 6 = 3(<i>x</i> + 2), so <i>a</i> = 3.`},
{id:"mh7",s:"m",d:"Algebra",k:"Linear functions",mod:"H",q:`The line <i>y</i> = <i>kx</i> + 2, where <i>k</i> is a constant, passes through the point (4, 14). What is the <i>x</i>-intercept of the line?`,c:["−3/2","−2/3","2/3","3"],a:1,x:`14 = 4<i>k</i> + 2 → <i>k</i> = 3. Set <i>y</i> = 0: 0 = 3<i>x</i> + 2 → <i>x</i> = −2/3.`},
{id:"mh8",s:"m",d:"Algebra",k:"Absolute value",mod:"H",q:`What is the sum of the solutions to |2<i>x</i> − 5| = 9?`,c:["2","5","7","9"],a:1,x:`2<i>x</i> − 5 = 9 gives <i>x</i> = 7; 2<i>x</i> − 5 = −9 gives <i>x</i> = −2. Sum: 7 + (−2) = 5.`},
{id:"mh9",s:"m",d:"Advanced Math",k:"Quadratics",mod:"H",t:"gi",ans:[9],q:`In the equation <i>x</i><sup>2</sup> − 6<i>x</i> + <i>k</i> = 0, <i>k</i> is a constant. If the equation has exactly one real solution, what is the value of <i>k</i>?`,x:`One solution means the discriminant is zero: (−6)<sup>2</sup> − 4(1)(<i>k</i>) = 0 → 36 = 4<i>k</i> → <i>k</i> = <b>9</b>. Check: <i>x</i><sup>2</sup> − 6<i>x</i> + 9 = (<i>x</i> − 3)<sup>2</sup>.`},
{id:"mh10",s:"m",d:"Advanced Math",k:"Quadratics",mod:"H",q:`The function <i>f</i> is defined by <i>f</i>(<i>x</i>) = (<i>x</i> − 2)(<i>x</i> + 4). For what value of <i>x</i> does <i>f</i> reach its minimum?`,c:["−4","−1","1","2"],a:1,x:`The zeros are 2 and −4, and the vertex sits halfway between them: (2 + (−4)) ÷ 2 = −1. Desmos shows this instantly.`},
{id:"mh11",s:"m",d:"Advanced Math",k:"Exponents",mod:"H",q:`For <i>x</i> ≠ 0, which expression is equivalent to (<i>x</i><sup>5</sup> · <i>x</i><sup>−2</sup>) ÷ <i>x</i><sup>4</sup>?`,c:["<i>x</i>","1/<i>x</i>","<i>x</i><sup>2</sup>","1/<i>x</i><sup>2</sup>"],a:1,x:`Add exponents when multiplying (5 + (−2) = 3), subtract when dividing (3 − 4 = −1). <i>x</i><sup>−1</sup> = 1/<i>x</i>.`},
{id:"mh12",s:"m",d:"Advanced Math",k:"Rational equations",mod:"H",t:"gi",ans:[5],q:`What value of <i>x</i> satisfies 3/(<i>x</i> − 2) = 6/(<i>x</i> + 1)?`,x:`Cross-multiply: 3(<i>x</i> + 1) = 6(<i>x</i> − 2) → 3<i>x</i> + 3 = 6<i>x</i> − 12 → 15 = 3<i>x</i> → <i>x</i> = <b>5</b>. It doesn't make either denominator zero, so it's valid.`},
{id:"mh13",s:"m",d:"Advanced Math",k:"Exponential functions",mod:"H",q:`The value of a car <i>t</i> years after purchase is modeled by <i>V</i>(<i>t</i>) = 24,000(0.85)<sup><i>t</i></sup>. Which statement best describes the meaning of 0.85 in this model?`,c:["The car's value decreases by $0.85 each year.","The car's value decreases by 85% each year.","The car's value decreases by 15% each year.","The car's value is 85% of its original value after 15 years."],a:2,x:`Multiplying by 0.85 keeps 85% each year, which means losing 15% each year.`},
{id:"mh14",s:"m",d:"Advanced Math",k:"Function notation",mod:"H",q:`The function <i>g</i> is defined by <i>g</i>(<i>x</i>) = <i>x</i><sup>2</sup> + <i>bx</i> + 10, where <i>b</i> is a constant. If <i>g</i>(2) = 4, what is the value of <i>b</i>?`,c:["−7","−5","5","7"],a:1,x:`4 + 2<i>b</i> + 10 = 4 → 2<i>b</i> = −10 → <i>b</i> = −5.`},
{id:"mh15",s:"m",d:"Advanced Math",k:"Nonlinear systems",mod:"H",q:`<i>y</i> = <i>x</i><sup>2</sup> − 4<i>x</i> + 7<br><i>y</i> = 2<i>x</i> − 2<br>How many points of intersection do the graphs of these equations have?`,c:["Zero","Exactly one","Exactly two","Infinitely many"],a:1,x:`Set equal: <i>x</i><sup>2</sup> − 6<i>x</i> + 9 = 0 → (<i>x</i> − 3)<sup>2</sup> = 0. One solution, so the line touches the parabola once (at (3, 4)).`},
{id:"mh16",s:"m",d:"Problem-Solving & Data Analysis",k:"Percentages",mod:"H",q:`The price of a jacket was increased by 20%. Later, the new price was decreased by 20%. How does the final price compare with the original price?`,c:["It is the same.","It is 4% less.","It is 4% more.","It is 20% less."],a:1,x:`1.20 × 0.80 = 0.96, so the final price is 96% of the original: 4% less. The percentages apply to different starting amounts, so they don't cancel.`},
{id:"mh17",s:"m",d:"Problem-Solving & Data Analysis",k:"Mean and median",mod:"H",t:"gi",ans:[30],q:`The mean of 5 numbers is 18. When a sixth number is added, the mean of the 6 numbers is 20. What is the sixth number?`,x:`Original total: 5 × 18 = 90. New total: 6 × 20 = 120. The sixth number is 120 − 90 = <b>30</b>.`},
{id:"mh18",s:"m",d:"Problem-Solving & Data Analysis",k:"Sampling and inference",mod:"H",q:`A random sample of 400 voters in a city found that 52% support a proposal. The margin of error for the estimate is 4 percentage points. Which conclusion is most appropriate?`,c:["The percentage of all voters in the city who support the proposal is plausibly between 48% and 56%.","Exactly 52% of all voters in the city support the proposal.","More than half of all voters in the city definitely support the proposal.","The proposal will pass with 56% of the vote."],a:0,x:`A margin of error gives a plausible range: 52 ± 4. Since the range dips below 50%, you can't say "definitely more than half."`},
{id:"mh19",s:"m",d:"Problem-Solving & Data Analysis",k:"Rates",mod:"H",q:`A water tank is filled at a constant rate of 12 liters per minute. How many hours will it take to fill an empty tank that holds 2,160 liters?`,c:["2","3","18","180"],a:1,x:`2,160 ÷ 12 = 180 minutes, and 180 ÷ 60 = 3 hours. The 180 trap forgets to convert units.`},
{id:"mh20",s:"m",d:"Geometry & Trigonometry",k:"Similar triangles",mod:"H",t:"gi",ans:[125],q:`Triangle <i>ABC</i> is similar to triangle <i>DEF</i>, where side <i>AB</i> corresponds to side <i>DE</i>. If <i>AB</i> = 6, <i>DE</i> = 15, and the area of triangle <i>ABC</i> is 20, what is the area of triangle <i>DEF</i>?`,x:`The scale factor is 15/6 = 2.5. Areas scale by the <i>square</i> of the factor: 2.5<sup>2</sup> = 6.25, and 20 × 6.25 = <b>125</b>.`},
{id:"mh21",s:"m",d:"Geometry & Trigonometry",k:"Circles",mod:"H",q:`A circle in the <i>xy</i>-plane has equation <i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> − 6<i>x</i> + 8<i>y</i> = 0. What is the radius of the circle?`,c:["5","10","25","√14"],a:0,x:`Complete the square: (<i>x</i> − 3)<sup>2</sup> − 9 + (<i>y</i> + 4)<sup>2</sup> − 16 = 0 → (<i>x</i> − 3)<sup>2</sup> + (<i>y</i> + 4)<sup>2</sup> = 25. The radius is √25 = 5.`},
{id:"mh22",s:"m",d:"Geometry & Trigonometry",k:"Trigonometry",mod:"H",q:`In right triangle <i>ABC</i>, angle <i>C</i> is the right angle, tan <i>A</i> = 5/12, and the hypotenuse <i>AB</i> = 26. What is the length of side <i>BC</i>?`,c:["10","12","20","24"],a:0,x:`tan <i>A</i> = opposite/adjacent = <i>BC</i>/<i>AC</i> = 5/12, so the sides are 5<i>k</i>, 12<i>k</i>, 13<i>k</i>. 13<i>k</i> = 26 → <i>k</i> = 2, so <i>BC</i> = 5 × 2 = 10.`}

];

QS.forEach(q=>{ if(!q.mod) q.mod="1"; });
/* Stable shuffle of Reading & Writing choices so the correct answer isn't always in the same position */
function hashStr(s){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function seeded(seed){ return ()=>{ seed=(seed+0x6D2B79F5)|0; let t=Math.imul(seed^(seed>>>15),1|seed); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
QS.forEach(q=>{ if(q.s!=="rw"||!q.c) return; const r=seeded(hashStr(q.id+"psat")); const idx=[0,1,2,3];
  for(let i=3;i>0;i--){ const j=Math.floor(r()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  q.c=idx.map(i=>q.c[i]); q.a=idx.indexOf(q.a); });

  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },

};
