<title>PSAT Practice Room</title>

<style>
/* Layout: graph-paper desk; a test console (Bluebook-like two-pane) inside a calm, single-column study hub */
:root{
  --paper:#F5F7FA; --grid:#E4E9F0; --card:#FFFFFF; --ink:#18202D; --muted:#5A6577; --line:#D3DAE4;
  --accent:#2C55C9; --on-accent:#FFFFFF; --accent-soft:#E6ECFB;
  --pencil:#F0B400; --pencil-soft:#FFF4CC;
  --good:#1D8655; --good-soft:#E3F4EB; --bad:#BF3B34; --bad-soft:#FBE7E5;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --ui:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#10151D; --grid:#18202B; --card:#171E29; --ink:#E7ECF3; --muted:#9BA7B8; --line:#2A3443;
  --accent:#86A6FF; --on-accent:#0D1320; --accent-soft:#1E2A47;
  --pencil:#F5C842; --pencil-soft:#3A3014;
  --good:#4CC68C; --good-soft:#15301F; --bad:#F2776E; --bad-soft:#3A1C1A; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#10151D; --grid:#18202B; --card:#171E29; --ink:#E7ECF3; --muted:#9BA7B8; --line:#2A3443;
  --accent:#86A6FF; --on-accent:#0D1320; --accent-soft:#1E2A47;
  --pencil:#F5C842; --pencil-soft:#3A3014;
  --good:#4CC68C; --good-soft:#15301F; --bad:#F2776E; --bad-soft:#3A1C1A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
.brand i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--pencil)}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{font:600 .85rem var(--ui);background:none;border:0;color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--ink);background:var(--accent-soft)}
main{max-width:1100px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
footer{max-width:1100px;margin:0 auto;padding-block:8px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--muted);font-size:.8rem}

h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(1.9rem,4.5vw,3rem);line-height:1.05;font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.eyebrow{font:600 .72rem var(--ui);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.lede{font-family:var(--body);font-size:1.12rem;max-width:62ch;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.hero{display:flex;flex-direction:column;gap:12px;padding-block:8px 20px}
.hero h1 mark{background:linear-gradient(transparent 60%,var(--pencil) 60%);color:inherit;padding:0 2px}

.btn{font:600 .92rem var(--ui);border-radius:10px;padding:10px 16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:6px 11px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.format{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--ink);border-radius:14px;background:var(--card);overflow:hidden}
.fcell{padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);min-width:0}
.fcell:last-child{border-right:0}
.fcell b{font-family:var(--display);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.fcell span:last-child{font-size:.84rem;color:var(--muted)}
@media(max-width:760px){.format{grid-template-columns:1fr 1fr}.fcell:nth-child(2){border-right:0}.fcell:nth-child(-n+2){border-bottom:1px solid var(--line)}}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}
@media(max-width:700px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile.feature{grid-column:1/-1;border:1.5px solid var(--ink)}
.tile p{color:var(--muted);font-size:.95rem}
.count{font:600 .75rem var(--mono);background:var(--pencil-soft);color:var(--ink);padding:2px 8px;border-radius:99px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.hist{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.hist td,.hist th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}

/* Test console */
.console{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;overflow:hidden}
.cbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cbar .lbl{font-weight:700;font-size:.92rem}
.timer{font:600 1.15rem var(--mono);font-variant-numeric:tabular-nums;margin:0 auto;padding:2px 10px;border-radius:8px}
.timer.warn{background:var(--bad-soft);color:var(--bad)}
.qwrap{display:grid;grid-template-columns:1fr 1fr;min-height:360px}
.qwrap.solo{grid-template-columns:minmax(0,720px);justify-content:center}
@media(max-width:780px){.qwrap{grid-template-columns:1fr}}
.pane{padding:20px;min-width:0}
.pane.passage{border-right:1px solid var(--line);font-family:var(--body);font-size:1.05rem;line-height:1.65}
@media(max-width:780px){.pane.passage{border-right:0;border-bottom:1px solid var(--line)}}
.passage p+p{margin-top:.8em}
.passage table{border-collapse:collapse;font-family:var(--ui);font-size:.9rem;margin-top:8px;font-variant-numeric:tabular-nums}
.passage th,.passage td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.passage ul{margin:.4em 0 0;padding-left:1.2em}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.qnum{background:var(--ink);color:var(--card);font:600 .85rem var(--mono);padding:3px 9px;border-radius:6px}
.flag{margin-left:auto;background:none;border:0;color:var(--muted);font:600 .82rem var(--ui);cursor:pointer;display:flex;gap:6px;align-items:center}
.flag[aria-pressed="true"]{color:var(--ink)}
.flag svg{width:14px;height:16px}
.flag[aria-pressed="true"] svg path{fill:var(--pencil)}
.stem{font-family:var(--body);font-size:1.05rem;margin-bottom:14px}
.skill{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:stretch;gap:6px}
.opt{flex:1;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);font:400 1rem var(--body);min-width:0}
.opt:hover{border-color:var(--accent)}
.opt .bub{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font:600 .8rem var(--ui)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.struck{opacity:.45}.opt.struck .txt{text-decoration:line-through}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.strike{flex:none;width:38px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--muted);cursor:pointer;font:600 .9rem var(--ui)}
.strike[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.gi{display:flex;flex-direction:column;gap:8px;max-width:260px}
.gi input{font:600 1.3rem var(--mono);padding:10px 12px;border:1.5px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.gi small{color:var(--muted)}
.cfoot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.cfoot .mid{margin:0 auto}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;padding:14px;border-top:1px solid var(--line)}
.nb{height:42px;border:1.5px dashed var(--muted);border-radius:8px;background:var(--card);color:var(--ink);font:600 .9rem var(--mono);cursor:pointer;position:relative}
.nb.ans{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.nb.cur{outline:2.5px solid var(--ink);outline-offset:1px}
.nb.fl::after{content:"";position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--pencil);border:2px solid var(--card)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);padding:0 14px 12px}
.feedback{margin-top:16px;border-radius:10px;padding:14px;font-family:var(--body)}
.feedback.ok{background:var(--good-soft)}.feedback.no{background:var(--bad-soft)}
.feedback b{font-family:var(--ui)}
.confirm{background:var(--pencil-soft);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Results */
.scorebig{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.scorebig .panel b{font-family:var(--display);font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,220px) 1fr 64px;gap:10px;align-items:center;font-size:.9rem}
@media(max-width:560px){.bar{grid-template-columns:1fr 56px}.bar .track{grid-column:1/-1;grid-row:2}}
.track{height:12px;border-radius:99px;background:var(--grid);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--accent)}
.fill.lo{background:var(--bad)}.fill.hi{background:var(--good)}
.pct{font:600 .85rem var(--mono);text-align:right;font-variant-numeric:tabular-nums}
details.item{border-bottom:1px solid var(--line);padding:10px 0}
details.item summary{cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
details.item summary::-webkit-details-marker{display:none}
.mk{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 .8rem var(--ui)}
.mk.ok{background:var(--good-soft);color:var(--good)}.mk.no{background:var(--bad-soft);color:var(--bad)}
.item .body{padding:10px 0 4px 34px;font-family:var(--body);display:flex;flex-direction:column;gap:8px}
.item .body .x{color:var(--muted)}
.dom-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.dom-grid{grid-template-columns:1fr}}
.dombtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;font:600 .95rem var(--ui)}
.dombtn:hover{border-color:var(--accent)}
.dombtn small{color:var(--muted);font-weight:500}
select{font:500 .88rem var(--ui);padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.jitem{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.jitem .stem{margin:0;font-size:.98rem}
.tips{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:700px){.tips{grid-template-columns:1fr}}
.tip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.tip p,.tip li{font-family:var(--body);color:var(--ink)}
.tip ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:4px}
.tip .tag{font:600 .72rem var(--mono);color:var(--muted)}
.week{width:100%;border-collapse:collapse;font-size:.92rem}
.week td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.week td:first-child{font-weight:700;white-space:nowrap;width:70px}
a{color:var(--accent)}
@media (prefers-reduced-motion: no-preference){.fill{transition:width .6s ease}}
</style>
